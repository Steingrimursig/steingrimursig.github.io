let mPairs = {}, mSel = null, mOrder = null;
def('ordtok','Orðasambönd','Paraðu saman', () => {
  if(!mOrder){ mOrder = IDIOMS.map((_,i)=>i).sort(()=>Math.random()-.5); }
  return `<p class="lead">Átta orðasambönd úr textanum. Smelltu á orðasamband og svo á merkinguna sem passar.</p>
  <div class="match">
   <div class="col"><h3>Orðasamband</h3>${IDIOMS.map((x,i)=>`<button class="chip ${mSel===i?'sel':''} ${mPairs[i]!==undefined?'paired':''}" data-l="${i}">
     ${mPairs[i]!==undefined?`<span class="tag">${String.fromCharCode(65+mOrder.indexOf(mPairs[i]))}</span>`:''}${x[0]}</button>`).join('')}</div>
   <div class="col"><h3>Merking</h3>${mOrder.map((j,k)=>`<button class="chip ${Object.values(mPairs).includes(j)?'paired':''}" data-r="${j}"><span class="tag">${String.fromCharCode(65+k)}</span>${IDIOMS[j][1]}</button>`).join('')}</div>
  </div>
  <div class="row-actions"><button class="btn" id="mcheck">Athuga</button><button class="btn ghost" id="mreset">Byrja aftur</button><span class="result" id="mres"></span></div>
  ${nb(['Skrifaðu orðasamböndin átta og merkingu þeirra.','Veldu fjögur og skrifaðu eina setningu um <b>þitt eigið líf</b> með hverju.'])}`;
});
T.ordtok.after = () => {
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { mSel = +b.dataset.l; render(); });
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    if(mSel===null) return; const j=+b.dataset.r;
    for(const k in mPairs) if(mPairs[k]===j) delete mPairs[k];
    mPairs[mSel]=j; mSel=null; render(); });
  document.getElementById('mreset').onclick = () => { mPairs={}; mSel=null; mOrder=null; render(); };
  document.getElementById('mcheck').onclick = () => {
    let ok=0; app.querySelectorAll('[data-l]').forEach(b => { const i=+b.dataset.l;
      if(mPairs[i]===undefined) return; const good = mPairs[i]===i; if(good) ok++; b.classList.add(good?'ok':'bad'); });
    document.getElementById('mres').textContent = `${ok} af ${IDIOMS.length} rétt`;
    if(ok===IDIOMS.length) markDone('ordtok');
  };
};

let posAns = {};
def('ordflokkar','Orðflokkagreining','Flokkaðu tíu orð', () => `

  ${nb(['Teiknaðu töflu með fjórum dálkum: sagnorð, nafnorð, lýsingarorð og óbeygjanleg orð.','Skrifaðu orðin í réttan dálk.','Aukaspurning: Eitt orðanna getur verið í tveimur orðflokkum. Hvaða orð er það? Skrifaðu setningu með hvorri merkingu.'])}`);
T.ordflokkar.after = () => {
  app.querySelectorAll('.sort .seg').forEach(seg => seg.addEventListener('click', e => {
    const b=e.target.closest('button'); if(!b) return; posAns[seg.dataset.i]=b.dataset.k;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('pr'+seg.dataset.i).style.background=''; }));
  document.getElementById('pcheck').onclick = () => {
    let ok=0; POS.forEach(([w,a],i)=>{ const row=document.getElementById('pr'+i); if(!posAns[i]){row.style.background='';return;}

    document.getElementById('pres').textContent = `${ok} af ${POS.length} rétt` + (ok===POS.length?' — vel gert! Mundu aukaspurninguna.':'');
    if(ok===POS.length) markDone('ordflokkar');
  };
};

  ${nb(['Finndu Öskju og Snæfellsjökul á Íslandskorti og merktu þau.','Hvers vegna heldur þú að landslag á Íslandi líkist tunglinu?','Í máli nr. 1 lærðir þú um danspláguna. Hvað eiga atburðurinn á Snæfellsjökli og dansplágan sameiginlegt?','Ef þú hefðir búið á Snæfellsnesi árið 1993, hefðirðu farið upp að jökli? Af hverju eða af hverju ekki?'])}
  <div class="row-actions">${extlink('https://www.explorationmuseum.com/astronaut-training/','Könnunarsafnið á Húsavík (á ensku)')}${extlink('https://www.visir.is/g/2013706209966/geimverurnar-lenda-a-snaefellsnesi','Vísir: Geimverurnar lenda á Snæfellsnesi')}</div>`);

def('fullyrdingar2','Hvað trúir þú núna?','Hefur skoðun þín breyst?', () => { const a=S.get('antic1',{}), b=S.get('antic2',{}); const L=['Sammála','Ósammála','Veit ekki'];
  return `<p class="lead">Taktu aftur afstöðu til sömu fullyrðinga og í byrjun. Fyrra svarið þitt sést undir hverri fullyrðingu.</p>
  <div class="words">${STATEMENTS.map((s,i)=>`<div class="wordrow"><span class="w" style="font-weight:400;flex:1 1 260px">${s}<small class="muted" style="display:block;font-size:.85rem">Í byrjun: ${a[i]!==undefined?L[a[i]]:'ekki svarað'}</small></span><div class="seg" data-a="${i}">
   ${L.map((l,k)=>`<button aria-pressed="${b[i]===k}" data-k="${k}">${l}</button>`).join('')}</div></div>`).join('')}</div>
  ${nb(['Veldu eina fullyrðingu þar sem skoðun þín breyttist, eða styrktist. Útskýrðu hvað í málinu hafði áhrif á þig.','Hvað myndir þú segja við vin sem trúir því að tunglferðirnar hafi verið sviðsettar? Skrifaðu þrjár setningar sem eru kurteisar en byggja á sönnunum.'])}`;});
T.fullyrdingar2.after = () => app.querySelectorAll('[data-a]').forEach(seg => seg.addEventListener('click', e => {
  const b=e.target.closest('button'); if(!b) return; const st=S.get('antic2',{}); st[seg.dataset.a]=+b.dataset.k; S.set('antic2',st);
  seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); markDone('fullyrdingar2'); }));

const SELF = ['Ég get útskýrt orðin kenning, blekking, samsæri og heimild.','Ég get greint á milli staðreyndar, skoðunar og fullyrðingar sem þarf að kanna.',
 'Ég kann fimm spurningarnar sem ég spyr um hverja heimild.','Ég get skráð heimild rétt í heimildaskrá.',
 'Ég get útskýrt hvers vegna þarf að athuga hvenær heimild var skrifuð.','Ég get nefnt tvær sannanir fyrir því að menn hafi farið til tunglsins.',
 'Ég merkti aftur við í „Hvað veit ég?“ og sé hvað ég hef lært.'];
def('sjalfsmat','Sjálfsmat','Hvað lærði ég?', () => { const st=S.get('self',{});
  return `<p class="lead">Hakaðu við það sem þú getur núna.</p>
  <div class="checks">${SELF.map((s,i)=>`<label><input type="checkbox" id="self${i}" ${st[i]?'checked':''}><span>${s}</span></label>`).join('')}</div>
  ${nb(['Teldu hve mörg orð þú merktir <em>Veit ekki</em> í byrjun en kannt núna. Skrifaðu: <em>Ég kann núna ___ ný orð.</em>','Skrifaðu eina setningu um það sem kom þér mest á óvart.'])}
  <button class="btn ghost" style="align-self:flex-start" data-go="hvadveit">Opna „Hvað veit ég?“ aftur</button>`;});
T.sjalfsmat.after = () => { SELF.forEach((_,i)=>document.getElementById('self'+i).onchange=e=>{ const st=S.get('self',{}); st[i]=e.target.checked; S.set('self',st); markDone('sjalfsmat'); }); };

/* ---------- framvinda ---------- */
const CFG = Object.assign({ heimildavinna:false, adlokum:false, rod:true }, window.STILLINGAR || {});
function markDone(id){ const d=S.get('done',{}); if(!d[id]){ d[id]=1; S.set('done',d); } }
const lokid = () => S.get('lokid',{});
const ORDER = GROUPS.flatMap(g=>g.ids);
const groupOf = id => GROUPS.find(g=>g.ids.includes(id));
const needCount = g => g.need==='all' ? g.ids.length : g.need;
const doneCount = g => { const l=lokid(); return g.ids.filter(id=>l[id]).length; };
const complete = g => doneCount(g) >= needCount(g);
function groupLock(g){
  if(g.teacher && !CFG[g.teacher]) return 'Kennarinn opnar þennan hluta síðar.';
  if(CFG.rod && g.after){ const missing=g.after.map(k=>GROUPS.find(x=>x.key===k)).filter(x=>!complete(x));
    if(missing.length) return 'Kláraðu fyrst: ' + missing.map(x=>x.t.toLowerCase()).join(' og ') + '.'; }
  return null;
}
const NUM = {2:'tvö',4:'fjórum',5:'fimm'};
function reqText(g){
  if(g.need==='all') return g.ids.length===1 ? 'Skylduverkefni' : g.ids.length===2 ? 'Gerðu bæði' : 'Gerðu öll';
  return `Veldu ${NUM[g.need]} af ${NUM[g.ids.length]}`;
}
function totals(){ return GROUPS.reduce((a,g)=>({tot:a.tot+needCount(g), dn:a.dn+Math.min(doneCount(g),needCount(g))}),{tot:0,dn:0}); }
const LOCK = '<svg class="lockico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';

/* ---------- leiðin mín (hliðarstika) ---------- */
function pathPanel(){
  const {tot,dn}=totals(), l=lokid();
  return `<div class="path-head"><span class="eyebrow">LEIÐIN MÍN</span>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${dn}"><span style="width:${tot?dn/tot*100:0}%"></span></div>
    <small>${dn} af ${tot} verkefnum lokið</small></div>
  <button class="pl home ${view==='radgatur'?'cur':''}" data-go="radgatur"><span class="st">i</span>Lykiltextinn og yfirlit</button>
  ${GROUPS.map(g=>{ const lock=groupLock(g), c=complete(g);
    return `<div class="pg ${lock?'locked':''} ${c?'complete':''}">
      <div class="pg-h"><b>${g.t}</b><span>${lock?LOCK+'Læst':c?'✓ Lokið':`${doneCount(g)} / ${needCount(g)}`}</span></div>
      <p class="pg-note">${lock || reqText(g)}</p>
      <ul>${g.ids.map(id=>`<li><button class="pl ${id===view?'cur':''} ${l[id]?'done':''}" data-go="${id}" ${lock?'disabled':''}><span class="st">${l[id]?'✓':''}</span>${T[id].title}</button></li>`).join('')}</ul>
    </div>`;}).join('')}`;
}

/* ---------- síður ---------- */
function header(back){
  return `<header class="top"><button class="brand" data-go="heim">RÁÐGÁTUSTOFAN</button>${back}</header>`;
}
function news(){
  const l=lokid(), started=S.get('done',{});
  return `<article class="sheet">
   <span class="eyebrow">${CASE.eyebrow}</span>
   <h1>${CASE.title}</h1>
   <p class="lead">${CASE.lead}</p>
   <a class="cta" href="${ARTICLE}" target="_blank" rel="noopener">${CASE.linkText}</a>
   <p class="muted">${CASE.note}</p>
  </article>
  ${GROUPS.map(g=>{ const lock=groupLock(g), c=complete(g);
    return `<section class="group"><div class="group-title"><h2>${g.t}</h2>${g.s?`<small>(${g.s})</small>`:''}
      <span class="req ${lock?'is-locked':c?'is-done':''}">${lock?LOCK+'Læst':c?'✓ Lokið':`${reqText(g)} · ${doneCount(g)}/${needCount(g)}`}</span></div>
     ${lock?`<p class="muted">${lock}</p>`:''}
     <div class="tasks">${g.ids.map(id=>{ const st = l[id]?'<span class="state ok">✓ Lokið</span>':started[id]?'<span class="state">Byrjað</span>':'';
       return lock ? `<div class="task locked" aria-disabled="true"><b>${T[id].title}</b><span>${T[id].sub}</span><span class="state">${LOCK}Læst</span></div>`
                   : `<button class="task ${l[id]?'is-done':''}" data-go="${id}"><b>${T[id].title}</b><span>${T[id].sub}</span>${st}</button>`;}).join('')}</div></section>`;}).join('')}`;
}
function task(id){
  const t=T[id], g=groupOf(id), lock=groupLock(g), l=lokid();
  if(lock) return `<article class="sheet"><span class="eyebrow">${g.t.toUpperCase()}</span><h1>${t.title}</h1>
    <p class="lead">${LOCK}Þetta verkefni er læst. ${lock}</p><button class="btn" style="align-self:flex-start" data-go="radgatur">Aftur í yfirlitið</button></article>`;
  const i=ORDER.indexOf(id), prev=ORDER[i-1], next=ORDER[i+1];
  return `<article class="sheet"><span class="eyebrow">${g.t.toUpperCase()} · ${reqText(g).toUpperCase()}</span><h1>${t.title}</h1>${t.render()}
    <div class="finish"><button class="btn ${l[id]?'is-done':''}" id="finish">${l[id]?'✓ Lokið. Smelltu til að afturkalla':'Ég er búin(n) með verkefnið'}</button>
    <span class="muted">${g.t}: ${Math.min(doneCount(g),needCount(g))} af ${needCount(g)} lokið</span></div></article>
  <nav class="pager">${prev?`<button class="back" data-go="${prev}">← ${T[prev].title}</button>`:'<span></span>'}${next?`<button class="back" data-go="${next}">${T[next].title} →</button>`:''}</nav>`;
}

let view = 'radgatur';
function render(){
  const {tot,dn}=totals();
  const back = T[view] ? '<button class="back" data-go="radgatur">← Öll verkefni</button>' : '<button class="back" data-go="heim">← Forsíða</button>';
  app.innerHTML = `${header(back)}
   <div class="layout"><aside class="path" aria-label="Leiðin mín">${pathPanel()}</aside><main class="col">${T[view]?task(view):news()}</main></div>
   <button class="pathfab ${window.scrollY>120?'show':''}" id="pathfab">Leiðin mín · ${dn}/${tot}</button>
   <div class="drawer" id="drawer" hidden><div class="drawer-panel" role="dialog" aria-label="Leiðin mín"><button class="back" id="drawclose" style="align-self:flex-start">Loka</button>${pathPanel()}</div></div>`;
  const fin=document.getElementById('finish');
  if(fin) fin.onclick=()=>{ const s=lokid(); if(s[view]) delete s[view]; else s[view]=true; S.set('lokid',s); render(); };
  document.getElementById('pathfab').onclick=()=>{ document.getElementById('drawer').hidden=false; };
  document.getElementById('drawclose').onclick=()=>{ document.getElementById('drawer').hidden=true; };
  document.getElementById('drawer').onclick=e=>{ if(e.target.id==='drawer') e.target.hidden=true; };
  if(T[view] && T[view].after && !groupLock(groupOf(view))) T[view].after();
}
function go(v){ if(v==='heim'){ location.href='../'; return; } view=v; render(); window.scrollTo({top:0}); try{ history.replaceState(null,'','#'+v); }catch(e){} }
app.addEventListener('click', e => { const b=e.target.closest('[data-go]'); if(b && !b.disabled){ e.preventDefault(); go(b.dataset.go); } });
window.addEventListener('scroll', () => { const f=document.getElementById('pathfab'); if(f) f.classList.toggle('show', window.scrollY>120); }, {passive:true});
const h = (location.hash||'').slice(1); if(h==='radgatur' || T[h]) view=h;
render();
</script>
</body>
</html>
