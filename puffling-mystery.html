main{max-width:980px;margin:0 auto;padding:20px}

.lock{text-align:center;color:var(--muted);padding:34px 20px;border:2px dashed var(--line);border-radius:14px;margin-bottom:18px;background:#fff}
.lock b{display:block;font-size:1.15rem;color:var(--navy);margin-bottom:4px}
.rule{background:#eef6ff;border-left:4px solid var(--sea);padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 14px;font-size:.95rem}
.bonus{border:2px solid var(--orange)}

.opt.sel{border-color:var(--sea);background:var(--sea);color:#fff}
.opt.right{outline:3px solid var(--green);outline-offset:1px}

input.gap,select.sel{font:inherit;padding:4px 8px;border:1.5px solid var(--line);border-radius:7px;background:#fff;min-width:110px}

input.gap:focus,select.sel:focus,textarea:focus{outline:none;border-color:var(--orange)}
.hint{color:var(--muted);font-size:.9rem}
.fb{font-size:.9rem;margin-top:6px;color:#9b2c3d}
.fb.ok{color:#1d7c70}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tok{font:inherit;padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.tok:hover:not(:disabled){border-color:var(--orange)}

.tok.wrong{background:var(--red);border-color:var(--red);color:#fff}

.small{font-size:.85rem;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:10px;margin:5px 0;flex-wrap:wrap}

textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;resize:vertical;min-height:90px;line-height:1.6}

.wc{font-size:.85rem;color:var(--muted);margin-top:4px}

.selfrow{padding:10px 0;border-bottom:1px solid var(--line)}

.lv{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.lv button.sel{background:var(--green);border-color:var(--green);color:#fff}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}

.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--green)}
.key li{margin:2px 0}
.case-closed{background:var(--yellow);color:var(--navy);border-radius:14px;padding:16px 20px;font-weight:700;margin-bottom:18px;text-align:center;font-size:1.1rem}

@media print{

`Sam Taylor had never seen so many birds in his life. When the small ferry arrived in Heimaey, the largest of the Westman Islands, the cliffs above the harbour were covered with puffins. “There are about a million of them here every summer,” said his cousin Ella, who was waiting for him on the pier with her little brother Óli. “But you came at the best time. It’s puffling season.”`,

/* ================= HJÁLPARFÖLL ================= */
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wc = s => (s||"").trim().split(/\s+/).filter(Boolean).length;
const norm = s => String(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]$/,"");
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const toks = s => s.split(" ");
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function perm(n,seed){const a=[...Array(n).keys()];let r=hash(seed)||1;for(let i=n-1;i>0;i--){r^=r<<13;r>>>=0;r^=r>>>17;r^=r<<5;r>>>=0;const j=r%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(a.every((x,i)=>x===i)&&n>1)a.push(a.shift());return a}

function answered(it){const v=S.ans[it.id];
 switch(it.t){
  case "mc":case "sel":case "err":return Number.isInteger(v);
  case "gap":return norm(v)!=="";
  case "build":case "order":return Array.isArray(v)&&v.length===it.w.length;
  case "match":return v&&it.pairs.every((_,i)=>Number.isInteger(v[i]));
  case "open":return wc(v)>0;
 }}
function grade(it){const v=S.ans[it.id];
 switch(it.t){
  case "mc":case "sel":case "err":return [v===it.a?1:0,1];
  case "gap":return [it.a.map(norm).includes(norm(v))?1:0,1];
  case "build":{const got=(v||[]).map(i=>it.w[i]).join(" ");return [got===it.w.join(" ")?1:0,1]}
  case "order":{let g=0;(v||[]).forEach((x,k)=>{if(x===k)g++});return [g,it.w.length]}
  case "match":{let g=0;it.pairs.forEach((_,i)=>{if(v&&v[i]===i)g++});return [g,it.pairs.length]}
  default:return [0,0];
 }}
function answerText(it){
 switch(it.t){
  case "mc":case "sel":return it.o[it.a];
  case "gap":return it.a[0];
  case "err":return `„${toks(it.s)[it.a].replace(/[.?!]$/,"")}“ → „${it.fix}“`;
  case "build":return cap(it.w.join(" "))+it.end;
  case "order":return it.w.map((w,i)=>(i+1)+". "+w).join("<br>");
  case "match":return it.pairs.map(p=>p[0]+" = "+p[1]).join(", ");
  default:return "";
 }}

function renderItem(it,done){
 const n=NUM[it.id], v=S.ans[it.id], dis=done?"disabled":"";
 let cls="item", body="", fb="";
 if(done && it.t!=="open"){
  const r=grade(it);
  cls+= r[0]===r[1]?" good":(r[0]>0?" part":" bad");
  fb = r[0]===r[1] ? `<div class="fb ok">✓ Rétt</div>` : `<div class="fb">Rétt svar: ${answerText(it)}</div>`;
 }
 switch(it.t){
 case "mc":
  body=`<p class="q"><b>${n}.</b> ${it.q}</p><div class="opts">`+it.o.map((o,i)=>`<button class="opt${v===i?" sel":""}${done&&i===it.a?" right":""}" data-act="mc" data-id="${it.id}" data-v="${i}" ${dis}>${o}</button>`).join("")+`</div>`;break;
 case "gap":
  body=`<p class="q"><b>${n}.</b> ${it.pre}<input class="gap" data-act="gap" data-id="${it.id}" value="${esc(v)}" ${dis} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"> <span class="hint">(${it.hint})</span>${it.post}</p>`;break;
 case "sel":
  body=`<p class="q"><b>${n}.</b> ${it.pre}<select class="sel" data-act="sel" data-id="${it.id}" ${dis}><option value="">— veldu —</option>`+it.o.map((o,i)=>`<option value="${i}" ${v===i?"selected":""}>${o}</option>`).join("")+`</select>${it.post}</p>`;break;
 case "err":
  body=`<p class="q"><b>${n}.</b></p><div class="tokens">`+toks(it.s).map((w,i)=>`<button class="tok${v===i?(done&&i!==it.a?" wrong":" sel"):""}" data-act="err" data-id="${it.id}" data-v="${i}" ${dis}>${esc(w)}</button>`).join("")+`</div>`;break;
 case "build":case "order":{
  const p=perm(it.w.length,it.id), chosen=v||[], col=it.t==="order";
  const area=chosen.length?chosen.map((ix,k)=>`<button class="tok sel${col?" block":""}" data-act="untok" data-id="${it.id}" data-k="${k}" ${dis}>${col?(k+1)+". ":""}${esc(it.w[ix])}</button>`).join("")+(it.end&&chosen.length===it.w.length?`<span>${it.end}</span>`:""):`<span class="ph">Smelltu á orðin hér fyrir neðan …</span>`;
  const bank=p.map(ix=>`<button class="tok${col?" block":""}${chosen.includes(ix)?" used":""}" data-act="tok" data-id="${it.id}" data-v="${ix}" ${dis||(chosen.includes(ix)?"disabled":"")}>${esc(it.w[ix])}</button>`).join("");
  body=`<p class="q"><b>${n}.</b> ${it.q||""}</p><div class="buildarea${col?" col":""}">${area}</div>${done?"":`<div class="tokens${col?" ":""}" style="${col?"flex-direction:column":""}">${bank}</div><div style="margin-top:6px"><button class="btn" style="padding:4px 12px;font-size:.85rem" data-act="clr" data-id="${it.id}">Hreinsa</button> <span class="small">Smelltu á orð í rammanum til að taka það út.</span></div>`}`;
  break;}
 case "match":{
  const p=perm(it.pairs.length,it.id), mv=v||{};
  body=`<p class="q"><b>${n}.</b> ${it.q}</p>`+it.pairs.map((pr,i)=>{
   const ok=done?(mv[i]===i?" ✓":` ✗ <span class="small">(${pr[1]})</span>`):"";
   return `<div class="mrow"><span class="en">${pr[0]}</span><select class="sel" data-act="match" data-id="${it.id}" data-i="${i}" ${dis}><option value="">— veldu —</option>${p.map(j=>`<option value="${j}" ${mv[i]===j?"selected":""}>${it.pairs[j][1]}</option>`).join("")}</select>${ok}</div>`}).join("");
  break;}
 case "open":
  body=`<p class="q"><b>${n}.</b> ${it.q}</p><textarea data-act="open" data-id="${it.id}" ${dis} placeholder="Write in English …">${esc(v)}</textarea><div class="wc" id="wc-${it.id}">${wc(v)} orð</div>${done?`<div class="small">Kennarinn fer yfir þetta svar.</div>`:""}`;break;
 }
 return `<div class="${cls}" id="it-${it.id}">${body}${fb}</div>`;
}
function scoreMsg(g,t){const p=t?g/t:0;return p>=.9?"Frábært!":p>=.7?"Vel gert!":p>=.5?"Ágætt – skoðaðu villurnar.":"Farðu vel yfir réttu svörin."}

function totals(list){let g=0,t=0;list.forEach(s=>{const sc=S.score[s.id];if(sc){g+=sc[0];t+=sc[1]}});const max=list.reduce((a,s)=>a+s.items.reduce((b,it)=>b+(it.t==="order"?it.w.length:it.t==="match"?it.pairs.length:it.t==="open"?0:1),0),0);return {g,t,max}}
function bar(g,max){const p=max?Math.round(100*g/max):0;return `<div class="bar"><i style="width:${p}%"></i></div>`}
function allClosed(){return STAMPS.every(s=>s[1]())}
function renderAssess(){
 const r=totals(READ), gr=totals(GRAM), b=totals([BONUS]);
 const opens=ALLSEC.flatMap(s=>s.items).filter(it=>it.t==="open");
 document.getElementById("tab-assess").innerHTML=`
 ${FEEDBACK&&(FEEDBACK.feedback||FEEDBACK.teacher_score)?`<div class="card" style="border:2px solid var(--green)"><h2>Umsögn kennara</h2>${FEEDBACK.teacher_score?`<p><b>Mat:</b> ${esc(FEEDBACK.teacher_score)}</p>`:""}<p style="white-space:pre-wrap;margin:0">${esc(FEEDBACK.feedback||"")}</p></div>`:""}
 ${allClosed()?`<div class="case-closed">🕵️ Máli lokað! Þú hefur klárað öll verkefnin. Prentaðu skilablaðið eða afritaðu það til kennarans.</div>`:""}
 <div class="card"><h2>Staðan þín</h2>
  <table>
   <tr><th>Hluti</th><th>Stig</th><th style="width:40%">Framvinda</th></tr>
   <tr><td>Lesskilningur (sjálfvirkt metið)</td><td>${r.g} / ${r.max}</td><td>${bar(r.g,r.max)}</td></tr>
   <tr><td>Málfræði (sjálfvirkt metið)</td><td>${gr.g} / ${gr.max}</td><td>${bar(gr.g,gr.max)}</td></tr>
   <tr><td>🌶️ Pipar-áskorun (aukastig)</td><td>${b.g} / ${b.max}</td><td>${bar(b.g,b.max)}</td></tr>
   <tr><td>Opin svör (kennari metur)</td><td>${opens.filter(answered).length} / ${opens.length} svarað</td><td></td></tr>
   <tr><td>Ritun 1 (kennari metur)</td><td>${wc(S.write.main)} orð</td><td></td></tr>
   <tr><td>Ritun 2 (kennari metur)</td><td>${wc(S.write.short)} orð</td><td></td></tr>
  </table>
 </div>
 <div class="card"><h2>Sjálfsmat</h2>
  ${SELF.map((s,i)=>`<div class="selfrow">${s}<div class="lv">${LEVELS.map((l,j)=>`<button class="${S.self[i]===j?"sel":""}" data-act="self" data-i="${i}" data-v="${j}">${l}</button>`).join("")}</div></div>`).join("")}
  <h3>Hvað fannst þér erfiðast?</h3><textarea data-act="selftext" data-k="hard" style="min-height:60px">${esc(S.selfText.hard)}</textarea>
  <h3>Hvað fannst þér skemmtilegast?</h3><textarea data-act="selftext" data-k="fun" style="min-height:60px">${esc(S.selfText.fun)}</textarea>
 </div>
 <div class="card"><h2>Skila til kennara</h2>
  <p style="margin-top:0">Skilablaðið inniheldur stig, opin svör, ritunarverkefnin, sjálfsmatið og matskvarða fyrir kennarann.</p>
  <div class="checkrow">
   <button class="btn primary" data-act="print">Prenta / vista sem PDF</button>
   <button class="btn" data-act="copy">Afrita sem texta</button>
   <button class="btn danger" data-act="reset" id="resetBtn">Byrja upp á nýtt</button>
   <span class="warn" id="copyMsg"></span>
  </div>
 </div>`;
}
function renderTeacher(){
 if(!TEACHER)return;
 const r=totals(READ), gr=totals(GRAM);
 const key=s=>`<h3>${s.title}</h3><ol class="key">${s.items.map(it=>`<li>${it.t==="open"?"<i>Opið svar – kennari metur</i>":answerText(it)}</li>`).join("")}</ol>`;
 document.getElementById("tab-teacher").innerHTML=`
 <div class="card"><h2>Fyrir kennara</h2>
  <p style="margin-top:0">Þessi flipi sést aðeins þegar <code>?kennari</code> er aftast í slóðinni. Í kennaraham eru allir kaflar opnir.</p>
  <ul>
   <li>Sjálfvirkt metið: lesskilningur (${r.max} stig) og málfræði (${gr.max} stig), auk ${totals([BONUS]).max} aukastiga í pipar-áskorun.</li>
   <li>Kennari metur: þrjú opin svör í lesskilningi, ritun 1 (120–200 orð) og ritun 2 (50–90 orð) með matskvarðanum hér fyrir neðan. Hann prentast líka á skilablað nemandans.</li>
   <li>Hver æfing er metin einu sinni (svörin læsast) svo stigin endurspegli fyrstu tilraun.</li>
   <li>Svör vistast í vafra nemandans (localStorage). Ef nemendur deila tæki þarf að smella á „Byrja upp á nýtt“ í Námsmati á milli.</li>
   <li>Áætlaður tími: 3–5 kennslustundir, eftir því hve mikið er gert heima.</li>
  </ul>
 </div>
 <div class="card"><h2>Matskvarði fyrir ritun</h2>${rubricTable(false)}</div>
 <div class="card"><h2>Lausnir</h2>${[...READ,...GRAM,BONUS].map(key).join("")}</div>`;
}
function rubricTable(blankCol){
 return `<table><tr><th>Viðmið</th><th>4 – Framúrskarandi</th><th>3 – Góð hæfni</th><th>2 – Á góðri leið</th><th>1 – Þarfnast æfingar</th>${blankCol?"<th>Ritun 1</th><th>Ritun 2</th>":""}</tr>${RUBRIC.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td>${blankCol?"<td></td><td></td>":""}</tr>`).join("")}</table>`;
}
const STAMPS=[
 ["Kafli 1",()=>!!S.done.r1],["Kafli 2",()=>!!S.done.r2],["Kafli 3",()=>!!S.done.r3],["Skýrsla",()=>!!S.done.rx],
 ["Málfræði",()=>GRAM.every(s=>S.done[s.id])],["Ritun",()=>wc(S.write.main)>=100&&wc(S.write.short)>=40],["Sjálfsmat",()=>SELF.every((_,i)=>Number.isInteger(S.self[i]))]];
function renderHeader(){
 document.getElementById("who").innerHTML=S.name?`🕵️ ${esc(S.name)}${S.cls?" · "+esc(S.cls):""}`:"";
 document.getElementById("stamps").innerHTML=STAMPS.map(s=>`<span class="stamp${s[1]()?" on":""}">${s[1]()?"✓ ":""}${s[0]}</span>`).join("");
}
function renderAll(){renderHeader();renderStart();renderRead();renderGram();renderWrite();renderAssess();renderTeacher()}

/* ================= SKILABLAÐ ================= */
function buildReport(){
 const r=totals(READ), gr=totals(GRAM), b=totals([BONUS]);
 const opens=ALLSEC.flatMap(s=>s.items).filter(it=>it.t==="open");
 const d=new Date().toLocaleDateString("is-IS");
 const secRows=[...READ,...GRAM,BONUS].map(s=>{const sc=S.score[s.id];return `<tr><td>${s.title}</td><td>${sc?sc[0]+" / "+sc[1]:"Ólokið"}</td></tr>`}).join("");
 document.getElementById("print").innerHTML=`
 <h1>The Puffling Mystery – skilablað</h1>
 <div><b>Nafn:</b> ${esc(S.name)||"________________"} &nbsp; <b>Bekkur:</b> ${esc(S.cls)||"______"} &nbsp; <b>Dags.:</b> ${d}</div>
 <h2>Sjálfvirkt metið</h2>
 <table><tr><th>Hluti</th><th>Stig</th></tr>
  <tr><td><b>Lesskilningur samtals</b></td><td><b>${r.g} / ${r.max}</b></td></tr>
  <tr><td><b>Málfræði samtals</b></td><td><b>${gr.g} / ${gr.max}</b></td></tr>
  <tr><td>Pipar-áskorun (aukastig)</td><td>${b.g} / ${b.max}</td></tr>${secRows}</table>
 <h2>Opin svör í lesskilningi</h2>
 ${opens.map(it=>`<p><b>${it.q.replace(/<[^>]+>/g,"")}</b></p><div class="pre">${esc(S.ans[it.id])||"<i>Ekki svarað</i>"}</div>`).join("")}
 <h2 class="pb">Ritun 1: ${S.write.choice!==null?WRITE_MAIN[S.write.choice].title:"Ekkert verkefni valið"} (${wc(S.write.main)} orð)</h2>
 ${S.write.choice!==null?`<p><i>${WRITE_MAIN[S.write.choice].en}</i></p>`:""}
 <div class="pre">${esc(S.write.main)||"<i>Ekkert skrifað</i>"}</div>
 <p><b>Gátlisti nemanda:</b> ${CHECKS.map((c,i)=>(S.checks[i]?"☑ ":"☐ ")+c).join(" &nbsp; ")}</p>
 <h2>Ritun 2: Tölvupóstur (${wc(S.write.short)} orð)</h2>
 <div class="pre">${esc(S.write.short)||"<i>Ekkert skrifað</i>"}</div>
 <h2>Sjálfsmat</h2>
 <table>${SELF.map((s,i)=>`<tr><td>${s}</td><td>${Number.isInteger(S.self[i])?LEVELS[S.self[i]]:"–"}</td></tr>`).join("")}</table>
 <p><b>Erfiðast:</b> ${esc(S.selfText.hard)||"–"}<br><b>Skemmtilegast:</b> ${esc(S.selfText.fun)||"–"}</p>
 <h2 class="pb">Mat kennara á ritun</h2>
 ${rubricTable(true)}
 <p style="margin-top:14px"><b>Opin svör í lesskilningi:</b> ______ / 6 &nbsp;&nbsp; <b>Ritun 1:</b> ______ / 16 &nbsp;&nbsp; <b>Ritun 2:</b> ______ / 16</p>
 <p><b>Umsögn kennara:</b></p>
 <div style="border-bottom:1px solid #999;height:28px"></div><div style="border-bottom:1px solid #999;height:28px"></div><div style="border-bottom:1px solid #999;height:28px"></div>`;
}
function reportText(){
 const r=totals(READ), gr=totals(GRAM), b=totals([BONUS]);
 const opens=ALLSEC.flatMap(s=>s.items).filter(it=>it.t==="open");
 let t=`THE PUFFLING MYSTERY – SKILABLAÐ\nNafn: ${S.name}  Bekkur: ${S.cls}  Dags.: ${new Date().toLocaleDateString("is-IS")}\n\n`;
 t+=`Lesskilningur: ${r.g}/${r.max}\nMálfræði: ${gr.g}/${gr.max}\nPipar-áskorun: ${b.g}/${b.max}\n\nOPIN SVÖR\n`;
 opens.forEach(it=>{t+=`- ${it.q.replace(/<[^>]+>/g,"")}\n  ${S.ans[it.id]||"(ekki svarað)"}\n`});
 t+=`\nRITUN 1: ${S.write.choice!==null?WRITE_MAIN[S.write.choice].title:"-"} (${wc(S.write.main)} orð)\n${S.write.main}\n\nRITUN 2: Tölvupóstur (${wc(S.write.short)} orð)\n${S.write.short}\n\nSJÁLFSMAT\n`;
 SELF.forEach((s,i)=>{t+=`- ${s} ${Number.isInteger(S.self[i])?LEVELS[S.self[i]]:"-"}\n`});
 t+=`Erfiðast: ${S.selfText.hard}\nSkemmtilegast: ${S.selfText.fun}\n`;
 return t;
}

/* ================= ATBURÐIR ================= */
function rerenderItem(id){const el=document.getElementById("it-"+id);if(el)el.outerHTML=renderItem(ITEM[id],!!S.done[ITEMSEC[id]])}
function showTab(name){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.id==="tab-"+name));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));window.scrollTo({top:0})}
function check(secId){
 if(S.done[secId])return;
 const sec=SEC[secId], miss=sec.items.filter(it=>!answered(it)).length, w=document.getElementById("warn-"+secId);
 if(miss&&w&&w.dataset.armed!=="1"){w.dataset.armed="1";w.textContent=`Þú átt eftir að svara ${miss===1?"einni spurningu":miss+" spurningum"}. Smelltu aftur ef þú vilt fara yfir samt.`;return}
 let g=0,t=0;sec.items.forEach(it=>{const r=grade(it);g+=r[0];t+=r[1]});
 S.done[secId]=true;S.score[secId]=[g,t];save();renderAll();
 const el=document.getElementById("sec-"+secId);if(el)el.lastElementChild.scrollIntoView({block:"center"});
}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b){if(b.dataset.tab==="assess")renderAssess();showTab(b.dataset.tab)}});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
 const a=b.dataset.act,id=b.dataset.id;
 if(id&&S.done[ITEMSEC[id]])return;
 switch(a){
  case "mc":case "err":S.ans[id]=+b.dataset.v;save();rerenderItem(id);break;
  case "tok":{const arr=S.ans[id]||[];const v=+b.dataset.v;if(!arr.includes(v))arr.push(v);S.ans[id]=arr;save();rerenderItem(id);break}
  case "untok":{const arr=S.ans[id]||[];arr.splice(+b.dataset.k,1);S.ans[id]=arr;save();rerenderItem(id);break}
  case "clr":S.ans[id]=[];save();rerenderItem(id);break;
  case "check":check(b.dataset.sec);break;
  case "go":if(!S.name.trim()){const w=document.getElementById("startWarn");w.textContent="Skrifaðu nafnið þitt fyrst.";w.style.color="var(--orange-d)";document.getElementById("nameIn").focus();return}showTab("read");break;
  case "wchoice":S.write.choice=+b.dataset.v;save();renderWrite();break;
  case "self":S.self[+b.dataset.i]=+b.dataset.v;save();renderAssess();renderHeader();break;
  case "print":buildReport();window.print();break;
  case "copy":{const txt=reportText(),m=document.getElementById("copyMsg");
   const done=()=>m.textContent="Afritað! Límdu textann þar sem kennarinn bað um.";
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));else fallbackCopy(txt,done);break}
  case "reset":if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Ertu viss? Smelltu aftur – öllum svörum verður eytt.";return}
   {const nm=S.name;S=blank();if(LOGGED)S.name=nm;save();renderAll();showTab("start");break}
 }
});
function fallbackCopy(txt,cb){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb()}catch(e){}ta.remove()}
document.addEventListener("input",e=>{
 const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;const id=el.dataset.id;
 switch(a){
  case "gap":S.ans[id]=el.value;break;
  case "open":S.ans[id]=el.value;document.getElementById("wc-"+id).textContent=wc(el.value)+" orð";break;
  case "name":S.name=el.value;renderHeader();break;
  case "cls":S.cls=el.value;renderHeader();break;
  case "wtext":{const k=el.dataset.k;S.write[k]=el.value;const n=wc(el.value),[lo,hi]=k==="main"?[120,200]:[50,90];const w=document.getElementById("wc-"+k);w.textContent=`${n} orð (markmið: ${lo}–${hi})`;w.classList.toggle("ok",n>=lo&&n<=hi);renderHeader();break}
  case "selftext":S.selfText[el.dataset.k]=el.value;break;
  default:return;
 }
 save();
});
document.addEventListener("change",e=>{
 const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;const id=el.dataset.id;
 if(a==="sel"){S.ans[id]=el.value===""?undefined:+el.value;save()}
 else if(a==="match"){const m=S.ans[id]||{};m[+el.dataset.i]=el.value===""?undefined:+el.value;S.ans[id]=m;save()}
 else if(a==="wcheck"){S.checks[+el.dataset.i]=el.checked;save()}
});
window.addEventListener("beforeprint",buildReport);

if(TEACHER)document.getElementById("teacherTabBtn").style.display="";
renderAll();
if(SKIL){
 SKIL.init({slug:"puffling-mystery",title:"The Puffling Mystery",subject:"Enska"}).then(rec=>{
  if(!rec)return;
  LOGGED=true;
  KEY=KEY_BASE+"_"+SKIL.code();
  const local=load(), remote=rec.data&&rec.data.ans?rec.data:null;
  S=remote&&(remote._t||0)>(local._t||0)?Object.assign(blank(),remote):local;
  S.name=rec.name||SKIL.name;
  FEEDBACK={feedback:rec.feedback,teacher_score:rec.teacher_score};
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  renderAll();
 });
}
</script>
</body>
</html>
