<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tímalína Evrópusögunnar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,600;0,800;1,600&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}

/* Layout: atlas-style horizontal time axis (proportional, 1800–2026), Iceland lane below the axis, detail card underneath */
:root{
  --paper:#eef1f4; --sheet:#f9fafb; --ink:#1a2333; --muted:#5a6476; --rule:#c9d0da; --grid:#dde2e9;
  --nap:#8c3557; --ind:#7d6a1f; --war:#a6402b; --cold:#2c6687; --new:#3f7552; --isl:#1d4ea0; --isl-red:#c8102e;
  --focus:#1d4ea0;
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12161d; --sheet:#1a2029; --ink:#e6eaf0; --muted:#9aa4b4; --rule:#343d4b; --grid:#252c37;
  --nap:#e08aac; --ind:#d6c06a; --war:#ec8a73; --cold:#7fbde0; --new:#8cc89e; --isl:#86a9f0; --isl-red:#ff6b7f;
  --focus:#86a9f0; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12161d; --sheet:#1a2029; --ink:#e6eaf0; --muted:#9aa4b4; --rule:#343d4b; --grid:#252c37;
  --nap:#e08aac; --ind:#d6c06a; --war:#ec8a73; --cold:#7fbde0; --new:#8cc89e; --isl:#86a9f0; --isl-red:#ff6b7f;
  --focus:#86a9f0; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 span{font-style:italic;font-weight:600;color:var(--muted)}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;font:500 15px var(--f-body);background:var(--sheet);border:1px solid var(--rule);
  color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 14px var(--f-body);background:transparent;border:1px solid var(--rule);
  color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;border:1.5px solid var(--c)}
.legend-label{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.track-wrap{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.track{position:relative}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.tick.major{background:var(--rule)}
.ticklabel{position:absolute;font:600 12px var(--f-mono);color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.axis{position:absolute;left:0;right:0;height:2px;background:var(--ink)}
.span{position:absolute;height:6px;border-radius:3px;background:var(--c);opacity:.85}
.spanlabel{position:absolute;font:500 11px var(--f-mono);color:var(--c);white-space:nowrap}
.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--sheet);border:2.5px solid var(--c);transform:translate(-50%,-50%)}
.stem{position:absolute;width:1.5px;background:var(--c);opacity:.6}
.flag{position:absolute;width:140px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--c);
  border-radius:3px;padding:4px 7px 5px;cursor:pointer;color:var(--ink);font:500 13px/1.2 var(--f-body);transition:transform .15s, box-shadow .15s}
.flag b{display:block;font:600 12px var(--f-mono);color:var(--c);font-variant-numeric:tabular-nums}
.flag:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.flag.active{background:var(--c);color:var(--sheet);border-color:var(--c)}
.flag.active b{color:var(--sheet)}
.dim{opacity:.16;pointer-events:none}
.isl-band{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.isl-tag{position:absolute;left:10px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--isl)}

.detail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;background:var(--sheet);border:1px solid var(--rule);
  border-top:4px solid var(--c);border-radius:6px;padding:22px 24px}
.detail .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.year{font:600 clamp(40px,7vw,64px)/1 var(--f-mono);color:var(--c);margin:8px 0 4px;font-variant-numeric:tabular-nums}
.year.hidden{color:var(--muted)}
.detail h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.detail p{margin:0;max-width:62ch}
.question{margin-top:16px;padding:12px 14px;border-radius:4px;background:var(--paper);max-width:62ch}
.question small{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.nav{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
.btn{font:500 15px var(--f-body);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--c);color:var(--sheet);border-color:var(--c)}
.count{font:500 13px var(--f-mono);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--muted);margin:0}
@media (max-width:640px){
  .detail{grid-template-columns:1fr;padding:18px}
  .nav{flex-direction:row;flex-wrap:wrap;min-width:0}
  .nav .btn{flex:1}
  .count{width:100%;order:-1}
}
@media (prefers-reduced-motion:reduce){ .flag{transition:none} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Evrópa frá 1800 <span>til okkar daga</span></h1>
      <p class="lede">Smelltu á atburð á tímalínunni til að lesa meira. Atburðir sem tengjast Íslandi eru fyrir neðan línuna.</p>
    </div>
    <div class="controls">
      <button class="toggle" id="quiz" aria-pressed="false">Fela ártöl</button>
    </div>
  </header>

  <div class="legend" id="legend"><span class="legend-label">Tímabil</span></div>

  <div class="track-wrap" id="trackWrap"><div class="track" id="track"></div></div>
  <p class="hint">Dragðu tímalínuna til hliðar eða notaðu örvatakkana ← → til að fara á milli atburða.</p>

  <section class="detail" id="detail" aria-live="polite"></section>
</div>

<script>
const ERAS = {
  nap:  {name:"Napóleon og nýtt valdajafnvægi", c:"--nap"},
  ind:  {name:"Iðnbylting og þjóðríki", c:"--ind"},
  war:  {name:"Heimsstyrjaldir og öfgar", c:"--war"},
  cold: {name:"Kalda stríðið og samruni Evrópu", c:"--cold"},
  new:  {name:"Nýliðin saga", c:"--new"},
  isl:  {name:"Ísland", c:"--isl"}
};

const EVENTS = [
  {y:1804, era:"nap", t:"Napóleon verður keisari",
   d:"Napóleon Bónaparte krýnir sig keisara Frakka í Notre-Dame-kirkjunni í París. Næstu ár leggja herir hans undir sig stóran hluta Evrópu í Napóleonsstyrjöldunum.",
   q:"Af hverju heldurðu að Napóleon hafi viljað kalla sig keisara?"},
  {y:1815, era:"nap", t:"Waterloo og Vínarfundurinn",
   d:"Napóleon tapar orrustunni við Waterloo í Belgíu. Á Vínarfundinum draga stórveldin ný landamæri og koma á friði sem heldur að mestu í áratugi.",
   q:"Hvaða kosti og galla hefur það að stórveldin ákveði landamæri annarra?"},
  {y:1825, era:"ind", t:"Fyrsta járnbrautin",
   d:"Fyrsta almenna járnbrautin sem notar gufueimreiðar opnar í Englandi, á milli Stockton og Darlington. Iðnbyltingin breiðist út og fólk flykkist úr sveitum í borgir.",
   q:"Hvernig breyttist líf fólks þegar hægt var að ferðast hratt á milli staða?"},
  {y:1848, era:"ind", t:"Byltingarárið",
   d:"Uppreisnir brjótast út í París, Vín, Berlín og fleiri borgum. Fólk krefst lýðræðis, tjáningarfrelsis og réttar til að stjórna sér sjálft. Kommúnistaávarp Marx og Engels kemur út sama ár.",
   q:"Hvaða réttindi myndir þú berjast fyrir ef þú hefðir þau ekki?"},
  {y:1861, era:"ind", t:"Ítalía sameinast",
   d:"Konungsríkið Ítalía er stofnað. Mörg smærri ríki og héruð sameinast í eitt land og Róm bætist við árið 1870.",
   q:"Hvað þarf til svo að fólk upplifi sig sem eina þjóð?"},
  {y:1871, era:"ind", t:"Þýskaland sameinast",
   d:"Þýska keisaradæmið er stofnað undir forystu Prússlands og Bismarcks kanslara. Nýtt stórveldi verður til í miðri Evrópu.",
   q:"Hvers vegna gat nýtt stórveldi í miðri Evrópu valdið spennu?"},
  {y:1885, era:"ind", t:"Berlínarráðstefnan", label:"1884–1885",
   d:"Evrópuríki setja reglur um hvernig þau skipta Afríku á milli sín, án þess að Afríkubúar fái nokkuð um það að segja. Nýlendustefnan nær hámarki.",
   q:"Hvers vegna skiptir máli hver fær að draga landamæri?"},
  {y:1914, era:"war", t:"Fyrri heimsstyrjöldin hefst", label:"1914–1918",
   d:"Frans Ferdínand, ríkisarfi Austurríkis-Ungverjalands, er myrtur í Sarajevó. Innan fárra vikna eru stórveldin komin í stríð og milljónir hermanna falla í skotgrafahernaði.",
   q:"Hvernig gat eitt morð leitt til heimsstyrjaldar?"},
  {y:1917, era:"war", t:"Rússneska byltingin",
   d:"Keisaranum er steypt af stóli og bolsévikar undir forystu Leníns taka völdin. Sovétríkin eru formlega stofnuð árið 1922.",
   q:"Hvers vegna gerir fólk byltingu?"},
  {y:1918, era:"isl", t:"Ísland verður fullvalda",
   d:"Ísland verður fullvalda ríki 1. desember 1918, í konungssambandi við Danmörku. Fyrri heimsstyrjöldinni lauk nokkrum vikum áður.",
   q:"Hver er munurinn á því að vera fullvalda og að vera lýðveldi?"},
  {y:1919, era:"war", t:"Versalasamningurinn",
   d:"Friðarsamningar eru gerðir eftir stríðið. Þýskaland þarf að greiða miklar stríðsskaðabætur og missir land. Mörg ný ríki verða til í Mið- og Austur-Evrópu.",
   q:"Getur friðarsamningur valdið nýju stríði?"},
  {y:1929, era:"war", t:"Kreppan mikla",
   d:"Hlutabréfamarkaðurinn í New York hrynur og kreppa breiðist um heiminn. Atvinnuleysi og fátækt ýta undir öfgaflokka í Evrópu.",
   q:"Hvers vegna sækir fólk frekar í öfgar þegar illa árar?"},
  {y:1933, era:"war", t:"Hitler kemst til valda",
   d:"Adolf Hitler verður kanslari Þýskalands. Nasistar afnema lýðræðið á skömmum tíma og ofsóknir gegn gyðingum hefjast.",
   q:"Hvernig getur lýðræði horfið á stuttum tíma?"},
  {y:1939, era:"war", t:"Seinni heimsstyrjöldin hefst", label:"1939–1945",
   d:"Þýskaland ræðst inn í Pólland 1. september 1939. Stríðið nær um allan heim og í helförinni myrða nasistar um sex milljónir gyðinga. Stríðinu lýkur árið 1945.",
   q:"Hvers vegna er mikilvægt að muna helförina?"},
  {y:1940, era:"isl", t:"Bretar hernema Ísland",
   d:"Breskur her gengur á land í Reykjavík 10. maí 1940. Bandaríkjamenn taka við vörnum landsins árið 1941 og samfélagið breytist hratt.",
   q:"Hvernig heldurðu að hernámið hafi breytt íslensku samfélagi?"},
  {y:1944, era:"isl", t:"Lýðveldið Ísland stofnað",
   d:"Lýðveldi er stofnað á Þingvöllum 17. júní 1944 og Sveinn Björnsson verður fyrsti forseti Íslands.",
   q:"Hvers vegna var lýðveldið stofnað á Þingvöllum?"},
  {y:1949, era:"cold", t:"NATO stofnað",
   d:"Tólf ríki stofna Atlantshafsbandalagið, þar á meðal Ísland. Evrópa skiptist í austur og vestur og kalda stríðið harðnar.",
   q:"Hvers vegna vildu ríki standa saman í varnarbandalagi?"},
  {y:1957, era:"cold", t:"Rómarsáttmálinn",
   d:"Sex ríki stofna Efnahagsbandalag Evrópu. Markmiðið er að tengja löndin svo þétt saman að stríð á milli þeirra verði óhugsandi. Bandalagið verður síðar Evrópusambandið.",
   q:"Getur samvinna í viðskiptum komið í veg fyrir stríð?"},
  {y:1961, era:"cold", t:"Berlínarmúrinn reistur",
   d:"Austur-þýsk stjórnvöld reisa múr í gegnum Berlín til að stöðva flótta fólks vestur. Múrinn skilur fjölskyldur að í 28 ár.",
   q:"Hvernig væri að búa í borg sem er skipt í tvennt?"},
  {y:1989, era:"cold", t:"Berlínarmúrinn fellur",
   d:"Eftir friðsamleg mótmæli eru landamærin opnuð 9. nóvember 1989. Kommúnistastjórnir í Austur-Evrópu falla hver af annarri og Þýskaland sameinast árið 1990.",
   q:"Hvaða áhrif geta friðsamleg mótmæli haft?"},
  {y:1991, era:"cold", t:"Sovétríkin líða undir lok",
   d:"Sovétríkin leysast upp í 15 sjálfstæð ríki, meðal annars Rússland, Úkraínu og Eystrasaltsríkin. Ísland er eitt fyrsta ríkið til að viðurkenna sjálfstæði Eystrasaltsríkjanna.",
   q:"Hvað gerist þegar stórt ríki leysist upp?"},
  {y:1991.6, era:"new", t:"Júgóslavíustríðin", label:"1991–1999",
   d:"Júgóslavía liðast í sundur og blóðug stríð brjótast út, meðal annars í Króatíu, Bosníu og Kósovó. Þetta eru mannskæðustu átök í Evrópu frá seinni heimsstyrjöld.",
   q:"Hvers vegna brjótast stundum út stríð á milli nágranna?"},
  {y:1993, era:"new", t:"Evrópusambandið verður til",
   d:"Maastricht-sáttmálinn tekur gildi og Evrópusambandið verður til. Íbúar aðildarríkjanna geta búið og starfað hvar sem er innan sambandsins.",
   q:"Hvaða kosti og galla hefur það að mörg lönd vinni náið saman?"},
  {y:2002, era:"new", t:"Evran tekin í notkun",
   d:"Evruseðlar og evrumynt koma í umferð í tólf löndum. Í dag nota um 20 ríki evruna sem gjaldmiðil.",
   q:"Hvaða kosti hefur það að mörg lönd noti sama gjaldmiðil?"},
  {y:2020, era:"new", t:"Bretland gengur úr ESB", label:"2016–2020",
   d:"Bretar kjósa árið 2016 að ganga úr Evrópusambandinu og útgangan tekur gildi 31. janúar 2020. Bretland er fyrsta ríkið til að yfirgefa sambandið.",
   q:"Hvers vegna gæti land viljað ganga úr bandalagi?"},
  {y:2022, era:"new", t:"Innrás Rússa í Úkraínu",
   d:"Rússar hefja allsherjarinnrás í Úkraínu 24. febrúar 2022. Þetta er stærsta stríð í Evrópu frá seinni heimsstyrjöld.",
   q:"Hvernig hefur stríðið í Úkraínu haft áhrif á Evrópu?"}
];

const SPANS = [
  {a:1803, b:1815, era:"nap", t:"Napóleonsstyrjaldirnar"},
  {a:1914, b:1918, era:"war", t:"Fyrri heimsstyrjöld"},
  {a:1939, b:1945, era:"war", t:"Seinni heimsstyrjöld"},
  {a:1947, b:1991, era:"cold", t:"Kalda stríðið"}
];

const Y0 = 1797, Y1 = 2030, PX = 9, PAD = 20;
const FLAG_W = 148, LANE_H = 54, FLAG_H = 46;
const x = y => PAD + (y - Y0) * PX;
const W = x(Y1) + PAD;
const yearText = e => e.label || String(Math.floor(e.y));

// Lane assignment (Europe above axis, Iceland below)
function assign(list){
  const ends = [];
  list.forEach(e => {
    const left = x(e.y) - 10;
    let lane = ends.findIndex(end => end < left);
    if (lane === -1){ lane = ends.length; ends.push(0); }
    ends[lane] = left + FLAG_W + 6;
    e.lane = lane;
  });
  return ends.length;
}
EVENTS.forEach((e,i)=> e.i = i);
const eu = EVENTS.filter(e=>e.era!=="isl"), is = EVENTS.filter(e=>e.era==="isl");
const euLanes = assign(eu), isLanes = assign(is);

const TOP = 26 + euLanes * LANE_H;      // axis y
const SPAN_Y = TOP + 12;
const ISL_Y = TOP + 56;
const H = ISL_Y + 22 + isLanes * LANE_H + 28;

const track = document.getElementById('track');
const wrap = document.getElementById('trackWrap');
track.style.width = W + 'px';
track.style.height = H + 'px';
const el = (cls, style, html='') => { const d=document.createElement('div'); d.className=cls; Object.assign(d.style, style); d.innerHTML=html; track.appendChild(d); return d; };
const cvar = era => `var(${ERAS[era].c})`;

// Grid
for (let y = 1800; y <= 2020; y += 10){
  const major = y % 50 === 0;
  el('tick' + (major ? ' major':''), {left:x(y)+'px'});
}
for (let y = 1800; y <= 2020; y += 20){
  el('ticklabel', {left:x(y)+'px', top:(H - 20)+'px'}, y);
}
el('axis', {top:(TOP-1)+'px'});
el('isl-band', {top:ISL_Y+'px'});
el('isl-tag', {top:(ISL_Y+4)+'px'}, 'Ísland');

// Spans
SPANS.forEach(s=>{
  el('span', {left:x(s.a)+'px', width:(x(s.b)-x(s.a))+'px', top:SPAN_Y+'px', '--c':cvar(s.era)}).dataset.era = s.era;
  el('spanlabel', {left:x(s.a)+'px', top:(SPAN_Y+9)+'px', '--c':cvar(s.era)}, s.t).dataset.era = s.era;
});

// Events
const flags = [];
EVENTS.forEach(e=>{
  const ex = x(e.y), isl = e.era==="isl";
  const c = {'--c':cvar(e.era)};
  let flagTop, stemTop, stemH;
  if (!isl){
    flagTop = TOP - 14 - FLAG_H - e.lane * LANE_H;
    stemTop = flagTop + FLAG_H; stemH = TOP - stemTop;
  } else {
    flagTop = ISL_Y + 22 + e.lane * LANE_H;
    stemTop = TOP; stemH = flagTop - TOP;
  }
  const stem = el('stem', {...c, left:(ex-0.75)+'px', top:stemTop+'px', height:stemH+'px'});
  const dot = el('dot', {...c, left:ex+'px', top:TOP+'px'});
  const b = document.createElement('button');
  b.className = 'flag'; Object.assign(b.style, c, {left:(ex-10)+'px', top:flagTop+'px'});
  b.innerHTML = `<b data-year="${yearText(e)}">${yearText(e)}</b>${e.t}`;
  b.addEventListener('click', ()=> select(e.i, true));
  track.appendChild(b);
  e.nodes = [stem, dot, b]; flags[e.i] = b;
});

// State
let current = 0, quiz = false, revealed = false;
const active = new Set(Object.keys(ERAS));
try { const s = JSON.parse(localStorage.getItem('evr-eras')||'null'); if (Array.isArray(s) && s.length){ active.clear(); s.forEach(k=>ERAS[k]&&active.add(k)); } } catch(_){}

const legend = document.getElementById('legend');
Object.entries(ERAS).forEach(([k,v])=>{
  const b = document.createElement('button');
  b.className='chip'; b.style.setProperty('--c', cvar(k));
  b.setAttribute('aria-pressed', active.has(k));
  b.innerHTML = `<i></i>${v.name}`;
  b.addEventListener('click', ()=>{
    if (active.has(k)) { if (active.size===1) return; active.delete(k); } else active.add(k);
    b.setAttribute('aria-pressed', active.has(k));
    try{ localStorage.setItem('evr-eras', JSON.stringify([...active])); }catch(_){}
    applyFilter();
    if (!active.has(EVENTS[current].era)) select(visible()[0], true);
  });
  legend.appendChild(b);
});

const visible = () => EVENTS.filter(e=>active.has(e.era)).map(e=>e.i);
function applyFilter(){
  EVENTS.forEach(e=> e.nodes.forEach(n=> n.classList.toggle('dim', !active.has(e.era))));
  track.querySelectorAll('.span,.spanlabel').forEach(n=> n.classList.toggle('dim', !active.has(n.dataset.era)));
}

const quizBtn = document.getElementById('quiz');
quizBtn.addEventListener('click', ()=>{
  quiz = !quiz; quizBtn.setAttribute('aria-pressed', quiz);
  quizBtn.textContent = quiz ? 'Sýna ártöl' : 'Fela ártöl';
  flags.forEach(f=>{ const b=f.querySelector('b'); b.textContent = quiz ? '????' : b.dataset.year; });
  revealed = false; render();
});

const detail = document.getElementById('detail');
function render(){
  const e = EVENTS[current], vis = visible(), pos = vis.indexOf(current);
  detail.style.setProperty('--c', cvar(e.era));
  const hide = quiz && !revealed;
  detail.innerHTML = `
    <div>
      <div class="meta">${ERAS[e.era].name}</div>
      <div class="year ${hide?'hidden':''}">${hide ? 'Hvaða ár?' : yearText(e)}</div>
      <h2>${e.t}</h2>
      <p>${hide ? e.d.replace(/\b1[89]\d\d\b|\b20\d\d\b/g,'…') : e.d}</p>
      <div class="question"><small>Til umræðu</small>${e.q}</div>
    </div>
    <div class="nav">
      <span class="count">${pos+1} / ${vis.length}</span>
      ${hide ? '<button class="btn primary" id="reveal">Sýna ártal</button>' : ''}
      <button class="btn" id="prev" ${pos<=0?'disabled':''}>← Fyrri</button>
      <button class="btn" id="next" ${pos>=vis.length-1?'disabled':''}>Næsti →</button>
    </div>`;
  const r = document.getElementById('reveal'); if (r) r.onclick = ()=>{ revealed = true; render(); };
  document.getElementById('prev').onclick = ()=> step(-1);
  document.getElementById('next').onclick = ()=> step(1);
  flags.forEach((f,i)=> f.classList.toggle('active', i===current));
}
function select(i, scroll){
  current = i; revealed = false; render();
  if (scroll){
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    wrap.scrollTo({left: x(EVENTS[i].y) - wrap.clientWidth/2 + 60, behavior: reduce?'auto':'smooth'});
  }
}
function step(d){
  const vis = visible(), pos = vis.indexOf(current), n = vis[pos+d];
  if (n !== undefined) select(n, true);
}
document.addEventListener('keydown', ev=>{
  if (ev.key==='ArrowRight'){ step(1); ev.preventDefault(); }
  if (ev.key==='ArrowLeft'){ step(-1); ev.preventDefault(); }
});

applyFilter();
select(visible()[0], false);
</script>
</body>
</html>
