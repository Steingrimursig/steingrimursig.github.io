 ['strand','Í inngangnum efst og í kaflanum „Guð var í vinnu“'],
 ['aftakaveður','Fyrsta efnisgreinin á eftir inngangnum'],
 ['gæfa','Fyrsta efnisgreinin á eftir inngangnum'],
 ['smekkfullur','Fyrsta efnisgreinin á eftir inngangnum'],
 ['brúklegur','Fyrsta efnisgreinin á eftir inngangnum'],
 ['drekkhlaðinn','Kaflinn „Þetta er guðsgjöf, allt þetta timbur“'],
 ['farmur','Kaflinn „Þetta er guðsgjöf, allt þetta timbur“'],

 'smekkfullur':'Alveg fullur, svo ekkert meira kemst fyrir.',
 'brúklegur':'Sem hægt er að nota, nothæfur.',
 'drekkhlaðinn':'Hlaðinn svo miklu að hann ber varla meira.',

];
const POS = [['reka',['so']],['skipstjóri',['no']],['mannlaus',['lo']],['loks',['ob']],['bjarga',['so']],
 ['timbur',['no']],['voldugur',['lo']],['tvisvar',['ob']],['akkeri',['no']],['á',['ob','no']]];
const POSL = {so:'Sagnorð',no:'Nafnorð',lo:'Lýsingarorð',ob:'Óbeygjanlegt'};
const COMPOUNDS = [['draugaskip','drauga · skip'],['seglskip','segl · skip'],['járnbrautarteinar','járn · brautar · teinar'],
 ['harðviður','harð · viður'],['predikunarstóll','predikunar · stóll'],['áhugamannafélag','áhuga · manna · félag'],
 ['byggðasafn','byggða · safn'],['koparskjöldur','kopar · skjöldur'],['seglvinda','segl · vinda'],['brúargólf','brúar · gólf']];

const SUMLIMIT = 15;

/* ---------- verkefni ---------- */
const GROUPS = [
 {key:'fyrir', t:'Fyrir lestur', s:'og enn ekki fyrirlestur', need:'all', ids:['hvadveit','ordaspa']},
 {key:'medan', t:'Á meðan lesið er', need:'all', after:['fyrir'], ids:['ordaspor']},
 {key:'ordafordi', t:'Orðaforði', need:2, after:['medan'], ids:['kjarnaord','frayer','samsett','ordtok','ordflokkar']},
 {key:'lesskilningur', t:'Lesskilningur', need:2, after:['medan'], ids:['spurningar','millifyrirsagnir','timalina','samantekt']},
 {key:'samfelag', t:'Saga og heimildir', need:'all', teacher:'samfelagsfraedi', ids:['heimildaryni','timbur','kort','koparskjoldur']},
 {key:'lokum', t:'Að lokum', need:'all', teacher:'adlokum', ids:['ritun','sjalfsmat']}
];
const T = {};
const def = (id, title, sub, render) => T[id] = {id,title,sub,render};
const nb = (items, head='Í stílabókina') =>
  `<div class="notebook"><strong>${head}</strong><ol>${items.map(i=>`<li>${i}</li>`).join('')}</ol></div>`;
const extlink = (url, text) => `<a class="btn ghost" style="text-decoration:none;align-self:flex-start" href="${url}" target="_blank" rel="noopener">${text} ↗</a>`;

let hvTab = 0, qzWords = null, qzOrder = null, qzPairs = {}, qzSel = null, qzChecked = false;
function qzNew(){ const l = S.get('quiz',{}); const pool = CORE.map(([w])=>w);
  const fresh = pool.filter(w=>!l[w]).sort(()=>Math.random()-.5), old = pool.filter(w=>l[w]).sort(()=>Math.random()-.5);
  qzWords = [...fresh, ...old].slice(0,5); qzOrder = qzWords.map((_,i)=>i).sort(()=>Math.random()-.5); qzPairs = {}; qzSel = null; qzChecked = false; }
def('hvadveit','Hvað veit ég?','Skoðaðu orðin og prófaðu þig', () => {
  const st = S.get('know',{});
  const tabs = `<div class="tabs" role="tablist"><button role="tab" aria-selected="${hvTab===0}" data-hv="0">1. Skoðaðu orðin</button><button role="tab" aria-selected="${hvTab===1}" data-hv="1">2. Prófaðu þig</button></div>`;
  if(hvTab===0) return `<p class="lead">Áður en þú lest: hversu vel þekkir þú þessi orð? Merktu við og ýttu svo á <em>Sýna merkingu</em> til að sjá hvað orðið þýðir.</p>
  <div class="notebook"><strong>Þú þarft ekki að skrifa neitt</strong><p>Lestu merkingu hvers orðs vel. Þegar þú ert tilbúin(n) ferðu í <em>Prófaðu þig</em> og tengir saman orð og merkingu.</p></div>
  ${tabs}
  <div class="row-actions"><button class="btn ghost" id="showall">Sýna allar merkingar</button></div>
  <div class="words">${CORE.map(([w],i)=>`<div class="wordrow"><span class="w">${w}</span><div class="seg" data-w="${w}">
    ${['Þekki vel','Hef séð það','Veit ekki'].map((l,k)=>`<button aria-pressed="${st[w]===k}" data-i="${k}">${l}</button>`).join('')}</div>
    <button class="hint" data-d="${i}">Sýna merkingu</button><span class="hinttext" id="d${i}" hidden>${DEFS[w]}</span></div>`).join('')}</div>
  <div class="row-actions"><button class="btn" data-hv="1">Ég er tilbúin(n) í prófið →</button></div>`;
  if(!qzWords) qzNew();
  const learned = S.get('quiz',{}), n = CORE.filter(([w])=>learned[w]).length;
  return `<p class="lead">Smelltu á orð og svo á merkinguna sem passar. Fimm orð eru í hverri umferð. Orð sem þú hefur ekki enn fengið rétt koma fyrst.</p>
  ${tabs}
  <div class="path-head"><div class="meter"><span style="width:${n/CORE.length*100}%"></span></div><small>${n} af ${CORE.length} orðum rétt</small></div>
  <div class="match">
   <div class="col"><h3>Orð</h3>${qzWords.map((w,i)=>`<button class="chip ${qzSel===i?'sel':''} ${qzPairs[i]!==undefined?'paired':''}" data-ql="${i}" ${qzChecked?'disabled':''}>
     ${qzPairs[i]!==undefined?`<span class="tag">${String.fromCharCode(65+qzOrder.indexOf(qzPairs[i]))}</span>`:''}${w}</button>`).join('')}</div>
   <div class="col"><h3>Merking</h3>${qzOrder.map((j,k)=>`<button class="chip ${Object.values(qzPairs).includes(j)?'paired':''}" data-qr="${j}" ${qzChecked?'disabled':''}><span class="tag">${String.fromCharCode(65+k)}</span>${DEFS[qzWords[j]]}</button>`).join('')}</div>
  </div>
  <div class="row-actions">${qzChecked?'<button class="btn" id="qznext">Næsta umferð →</button>':'<button class="btn" id="qzcheck">Athuga</button><button class="btn ghost" id="qzreset">Byrja umferðina aftur</button>'}<span class="result" id="qzres"></span></div>
  ${n===CORE.length?'<p class="result" style="color:var(--ok)">Vel gert! Þú hefur fengið öll orðin rétt. Ýttu á <em>Ég er búin(n)</em> hér fyrir neðan.</p>':''}`;
});
T.hvadveit.after = () => {
  app.querySelectorAll('[data-hv]').forEach(b => b.onclick = () => { hvTab = +b.dataset.hv; render(); });
  if(hvTab===0){
    app.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      const st = S.get('know',{}); st[seg.dataset.w] = +b.dataset.i; S.set('know',st);
      seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); markDone('hvadveit');
    }));
    app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const t=document.getElementById('d'+b.dataset.d); t.hidden=!t.hidden; b.textContent=t.hidden?'Sýna merkingu':'Fela merkingu'; markDone('hvadveit'); });
    document.getElementById('showall').onclick = e => { const open = e.target.dataset.open!=='1';
      app.querySelectorAll('[data-d]').forEach(b => { document.getElementById('d'+b.dataset.d).hidden=!open; b.textContent=open?'Fela merkingu':'Sýna merkingu'; });
      e.target.dataset.open = open?'1':''; e.target.textContent = open?'Fela allar merkingar':'Sýna allar merkingar'; markDone('hvadveit'); };
    return;
  }
  app.querySelectorAll('[data-ql]').forEach(b => b.onclick = () => { qzSel = +b.dataset.ql; render(); });
  app.querySelectorAll('[data-qr]').forEach(b => b.onclick = () => { if(qzSel===null) return; const j=+b.dataset.qr;
    for(const k in qzPairs) if(qzPairs[k]===j) delete qzPairs[k]; qzPairs[qzSel]=j; qzSel=null; render(); });
  const nx = document.getElementById('qznext'); if(nx) nx.onclick = () => { qzNew(); render(); };
  const rs = document.getElementById('qzreset'); if(rs) rs.onclick = () => { qzPairs={}; qzSel=null; render(); };
  const ck = document.getElementById('qzcheck');
  if(ck) ck.onclick = () => {
    if(Object.keys(qzPairs).length < qzWords.length){ document.getElementById('qzres').textContent='Paraðu öll fimm orðin fyrst.'; return; }
    const l = S.get('quiz',{}); let ok=0;
    qzWords.forEach((w,i)=>{ if(qzPairs[i]===i){ ok++; l[w]=1; } });
    S.set('quiz',l); qzChecked = true; markDone('hvadveit'); render();
    app.querySelectorAll('[data-ql]').forEach(b => { const i=+b.dataset.ql; b.classList.add(qzPairs[i]===i?'ok':'bad'); });
    document.getElementById('qzres').textContent = `${ok} af ${qzWords.length} rétt`;
  };
};

let mPairs = {}, mSel = null, mOrder = null;
def('ordtok','Orðasambönd','Paraðu saman', () => {
  if(!mOrder){ mOrder = IDIOMS.map((_,i)=>i).sort(()=>Math.random()-.5); }
  return `<p class="lead">Átta orðasambönd úr textanum. Smelltu á orðasamband og svo á merkinguna sem passar.</p>
  <div class="match">
   <div class="col"><h3>Orðasamband</h3>${IDIOMS.map((x,i)=>`<button class="chip ${mSel===i?'sel':''} ${mPairs[i]!==undefined?'paired':''}" data-l="${i}">
     ${mPairs[i]!==undefined?`<span class="tag">${String.fromCharCode(65+mOrder.indexOf(mPairs[i]))}</span>`:''}${x[0]}</button>`).join('')}</div>
   <div class="col"><h3>Merking</h3>${mOrder.map((j,k)=>`<button class="chip ${Object.values(mPairs).includes(j)?'paired':''}" data-r="${j}"><span class="tag">${String.fromCharCode(65+k)}</span>${IDIOMS[j][1]}</button>`).join('')}</div>

  <div class="row-actions"><button class="btn" id="mcheck">Athuga</button><button class="btn ghost" id="mreset">Byrja aftur</button><span class="result" id="mres"></span></div>

  <h3>A. Dagbók dóttur skipstjórans</h3>
  <p>Skrifaðu þrjár dagbókarfærslur: daginn sem skipið lagði af stað, daginn sem stýrið brotnaði og daginn sem áhöfninni var bjargað. Hvernig leið henni?</p>
  <h3>B. Frétt frá Höfnum árið 1881</h3>
  <p>Þú ert fréttamaður árið 1881. Skrifaðu frétt um skipið sem rak á land. Mundu eftir fyrirsögn, inngangi og að minnsta kosti einni millifyrirsögn.</p>
  ${nb(['Notaðu að minnsta kosti þrjú kjarnaorð og eitt orðasamband. Strikaðu undir þau.','Lestu yfir stafsetningu og greinarmerki áður en þú skilar.'])}
  <section class="bank"><h3>Orðabankinn</h3>
   <div class="bankwords">${CORE.map(([w])=>`<span class="bw">${w}</span>`).join('')}</div>
   <div class="bankidioms">${IDIOMS.map(([o,m])=>`<div><b>${o}</b> <span class="muted">${m}</span></div>`).join('')}</div>
   <div class="row-actions"><button class="btn ghost" data-go="kjarnaord">Kjarnaorðin 15</button><button class="btn ghost" data-go="ordtok">Orðasamböndin</button></div>
  </section>`);

const SELF = ['Ég get útskýrt orðin strand, farmur, sneypuför og örlög.','Ég get útskýrt hvað millifyrirsagnir gera í frétt.',
 'Ég get sagt söguna af Jamestown í réttri tímaröð.','Ég get útskýrt hvers vegna timbur var svona dýrmætt á Íslandi árið 1881.',
 'Ég get borið saman tvær heimildir sem stangast á og rökstutt hvorri ég treysti betur.','Ég get skráð heimild rétt í heimildaskrá.',
 'Ég fór aftur í „Hvað veit ég?“ og sé hvað ég hef lært.'];
def('sjalfsmat','Sjálfsmat','Hvað lærði ég?', () => { const st=S.get('self',{});
  return `<p class="lead">Hakaðu við það sem þú getur núna.</p>
  <div class="checks">${SELF.map((s,i)=>`<label><input type="checkbox" id="self${i}" ${st[i]?'checked':''}><span>${s}</span></label>`).join('')}</div>
  ${nb(['Teldu hve mörg orð þú merktir <em>Veit ekki</em> í byrjun en kannt núna. Skrifaðu: <em>Ég kann núna ___ ný orð.</em>','Skrifaðu eina setningu um það sem kom þér mest á óvart.'])}
  <button class="btn ghost" style="align-self:flex-start" data-go="hvadveit">Opna „Hvað veit ég?“ aftur</button>`;});
T.sjalfsmat.after = () => { SELF.forEach((_,i)=>document.getElementById('self'+i).onchange=e=>{ const st=S.get('self',{}); st[i]=e.target.checked; S.set('self',st); markDone('sjalfsmat'); }); };

/* ---------- framvinda ---------- */
const CFG = Object.assign({ samfelagsfraedi:false, adlokum:false, rod:true }, window.STILLINGAR || {});
function markDone(id){ const d=S.get('done',{}); if(!d[id]){ d[id]=1; S.set('done',d); } }
const lokid = () => S.get('lokid',{});
const ORDER = GROUPS.flatMap(g=>g.ids);
const groupOf = id => GROUPS.find(g=>g.ids.includes(id));
const needCount = g => g.need==='all' ? g.ids.length : g.need;
const doneCount = g => { const l=lokid(); return g.ids.filter(id=>l[id]).length; };
const complete = g => doneCount(g) >= needCount(g);
function groupLock(g){
  if(g.teacher && !CFG[g.teacher]) return 'Kennarinn opnar þennan hluta síðar.';
  if(CFG.rod && g.after){ const missing=g.after.map(k=>GROUPS.find(x=>x.key===k)).filter(x=>!complete(x));
    if(missing.length) return 'Kláraðu fyrst: ' + missing.map(x=>x.t.toLowerCase()).join(' og ') + '.'; }
  return null;
}
const NUM = {2:'tvö',4:'fjórum',5:'fimm'};
function reqText(g){
  if(g.need==='all') return g.ids.length===1 ? 'Skylduverkefni' : g.ids.length===2 ? 'Gerðu bæði' : 'Gerðu öll';
  return `Veldu ${NUM[g.need]} af ${NUM[g.ids.length]}`;
}
function totals(){ return GROUPS.reduce((a,g)=>({tot:a.tot+needCount(g), dn:a.dn+Math.min(doneCount(g),needCount(g))}),{tot:0,dn:0}); }
const LOCK = '<svg class="lockico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';

/* ---------- leiðin mín (hliðarstika) ---------- */
function pathPanel(){
  const {tot,dn}=totals(), l=lokid();
  return `<div class="path-head"><span class="eyebrow">LEIÐIN MÍN</span>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${dn}"><span style="width:${tot?dn/tot*100:0}%"></span></div>
    <small>${dn} af ${tot} verkefnum lokið</small></div>
  <button class="pl home ${view==='radgatur'?'cur':''}" data-go="radgatur"><span class="st">i</span>Fréttin og yfirlit</button>
  ${GROUPS.map(g=>{ const lock=groupLock(g), c=complete(g);
    return `<div class="pg ${lock?'locked':''} ${c?'complete':''}">
      <div class="pg-h"><b>${g.t}</b><span>${lock?LOCK+'Læst':c?'✓ Lokið':`${doneCount(g)} / ${needCount(g)}`}</span></div>
      <p class="pg-note">${lock || reqText(g)}</p>
      <ul>${g.ids.map(id=>`<li><button class="pl ${id===view?'cur':''} ${l[id]?'done':''}" data-go="${id}" ${lock?'disabled':''}><span class="st">${l[id]?'✓':''}</span>${T[id].title}</button></li>`).join('')}</ul>
    </div>`;}).join('')}`;
}

/* ---------- síður ---------- */
function header(back){
  return `<header class="top"><button class="brand" data-go="heim">RÁÐGÁTUSTOFAN</button>${back}</header>`;
}
function news(){
  const l=lokid(), started=S.get('done',{});
  return `<article class="sheet">
   <span class="eyebrow">${CASE.eyebrow}</span>
   <h1>${CASE.title}</h1>
   <p class="lead">${CASE.lead}</p>
   <a class="cta" href="${ARTICLE}" target="_blank" rel="noopener">${CASE.linkText}</a>
   <p class="muted">${CASE.note}</p>
  </article>
  ${GROUPS.map(g=>{ const lock=groupLock(g), c=complete(g);
    return `<section class="group"><div class="group-title"><h2>${g.t}</h2>${g.s?`<small>(${g.s})</small>`:''}
      <span class="req ${lock?'is-locked':c?'is-done':''}">${lock?LOCK+'Læst':c?'✓ Lokið':`${reqText(g)} · ${doneCount(g)}/${needCount(g)}`}</span></div>
     ${lock?`<p class="muted">${lock}</p>`:''}
     <div class="tasks">${g.ids.map(id=>{ const st = l[id]?'<span class="state ok">✓ Lokið</span>':started[id]?'<span class="state">Byrjað</span>':'';
       return lock ? `<div class="task locked" aria-disabled="true"><b>${T[id].title}</b><span>${T[id].sub}</span><span class="state">${LOCK}Læst</span></div>`
                   : `<button class="task ${l[id]?'is-done':''}" data-go="${id}"><b>${T[id].title}</b><span>${T[id].sub}</span>${st}</button>`;}).join('')}</div></section>`;}).join('')}`;
}
function task(id){
  const t=T[id], g=groupOf(id), lock=groupLock(g), l=lokid();
  if(lock) return `<article class="sheet"><span class="eyebrow">${g.t.toUpperCase()}</span><h1>${t.title}</h1>
    <p class="lead">${LOCK}Þetta verkefni er læst. ${lock}</p><button class="btn" style="align-self:flex-start" data-go="radgatur">Aftur í yfirlitið</button></article>`;
  const i=ORDER.indexOf(id), prev=ORDER[i-1], next=ORDER[i+1];
  return `<article class="sheet"><span class="eyebrow">${g.t.toUpperCase()} · ${reqText(g).toUpperCase()}</span><h1>${t.title}</h1>${t.render()}
    <div class="finish"><button class="btn ${l[id]?'is-done':''}" id="finish">${l[id]?'✓ Lokið. Smelltu til að afturkalla':'Ég er búin(n) með verkefnið'}</button>
    <span class="muted">${g.t}: ${Math.min(doneCount(g),needCount(g))} af ${needCount(g)} lokið</span></div></article>
  <nav class="pager">${prev?`<button class="back" data-go="${prev}">← ${T[prev].title}</button>`:'<span></span>'}${next?`<button class="back" data-go="${next}">${T[next].title} →</button>`:''}</nav>`;
}

let view = 'radgatur';
function render(){
  const {tot,dn}=totals();
  const back = T[view] ? '<button class="back" data-go="radgatur">← Öll verkefni</button>' : '<button class="back" data-go="heim">← Forsíða</button>';
  app.innerHTML = `${header(back)}
   <div class="layout"><aside class="path" aria-label="Leiðin mín">${pathPanel()}</aside><main class="col">${T[view]?task(view):news()}</main></div>
   <button class="pathfab ${window.scrollY>120?'show':''}" id="pathfab">Leiðin mín · ${dn}/${tot}</button>
   <div class="drawer" id="drawer" hidden><div class="drawer-panel" role="dialog" aria-label="Leiðin mín"><button class="back" id="drawclose" style="align-self:flex-start">Loka</button>${pathPanel()}</div></div>`;
  const fin=document.getElementById('finish');
  if(fin) fin.onclick=()=>{ const s=lokid(); if(s[view]) delete s[view]; else s[view]=true; S.set('lokid',s); render(); };
  document.getElementById('pathfab').onclick=()=>{ document.getElementById('drawer').hidden=false; };
  document.getElementById('drawclose').onclick=()=>{ document.getElementById('drawer').hidden=true; };
  document.getElementById('drawer').onclick=e=>{ if(e.target.id==='drawer') e.target.hidden=true; };
  if(T[view] && T[view].after && !groupLock(groupOf(view))) T[view].after();
}
function go(v){ if(v==='heim'){ location.href='../'; return; } view=v; render(); window.scrollTo({top:0}); try{ history.replaceState(null,'','#'+v); }catch(e){} }
app.addEventListener('click', e => { const b=e.target.closest('[data-go]'); if(b && !b.disabled){ e.preventDefault(); go(b.dataset.go); } });
window.addEventListener('scroll', () => { const f=document.getElementById('pathfab'); if(f) f.classList.toggle('show', window.scrollY>120); }, {passive:true});
const h = (location.hash||'').slice(1); if(h==='radgatur' || T[h]) view=h;
render();
</script>
</body>
</html>
