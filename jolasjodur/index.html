<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jólasjóður fjölskyldunnar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: chalkboard header (same family as Kennsluhub) → step rail → one step card at a time. Receipt step prints cleanly. */
:root{
  --bg:#f3efe6; --surface:#ffffff; --ink:#1d2622; --dim:#5d6a64; --line:#ddd5c6;
  --board:#183a2f; --chalk:#f4efe2; --chalk-dim:#bcc9bf;
  --red:#b8322a; --red-soft:#f8e1dd; --green:#1f7a45; --green-soft:#dcf1e3; --gold:#d69a1c; --gold-soft:#fbefd2;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121b17; --surface:#1b2722; --ink:#eef1ec; --dim:#a7b4ad; --line:#2f3f38;
  --red:#ff8a7c; --red-soft:#3e1f1b; --green:#6fd394; --green-soft:#183526; --gold:#f2c35a; --gold-soft:#3a2f14; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:980px;margin:0 auto}

header.hero{background:var(--board);color:var(--chalk);padding-block:28px 26px;
  background-image:radial-gradient(ellipse at 15% 0%,#25553f,var(--board) 70%)}
.hero small{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim)}
.hero h1{font-weight:700;font-size:clamp(32px,6vw,54px);margin:4px 0 6px}
.hero p{color:var(--chalk-dim);max-width:62ch}
.hero .who{margin-top:10px;font-weight:800;color:var(--chalk)}

nav.rail{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.rail .inner{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.rail button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;white-space:nowrap}
.rail button[aria-current="step"]{background:var(--board);color:var(--chalk);border-color:var(--board)}
.rail button:disabled{opacity:.45;cursor:not-allowed}
.rail .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold-soft);color:var(--ink);font-size:13px;margin-right:6px}
.rail button[aria-current="step"] .n{background:var(--gold);color:#1d2622}

main{padding-block:22px 70px}
main .inner{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:26px;margin-bottom:8px}
.card h3{font-size:19px;margin:6px 0 6px}
.lead{color:var(--dim);max-width:68ch}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
ul.clean{margin:0;padding-left:20px}
ul.clean li{margin:3px 0}
.box{border-radius:12px;padding:14px 16px;border:1.5px solid var(--line)}
.box.gold{background:var(--gold-soft);border-color:transparent}
.box.green{background:var(--green-soft);border-color:transparent}
.box.red{background:var(--red-soft);border-color:transparent}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:800;cursor:pointer;background:var(--board);color:var(--chalk)}
.btn.gold{background:var(--gold);color:#1d2622}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:800;color:var(--dim)}
input[type=text],input[type=number],input[inputmode],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical}
.stores{display:flex;flex-wrap:wrap;gap:8px}
.stores a{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}

/* fjölskylduspjald */
.famcard{border-radius:16px;overflow:hidden;border:2px solid var(--board)}
.famcard .top{background:var(--board);color:var(--chalk);padding:14px 18px}
.famcard .top h3{font-size:24px;margin:0}
.famcard .top p{color:var(--chalk-dim)}
.famcard .body{padding:16px 18px;display:grid;grid-template-columns:1fr 1.3fr;gap:18px;background:var(--surface)}
@media (max-width:720px){.famcard .body{grid-template-columns:1fr}}
table.money{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.money td{padding:5px 0;border-bottom:1px dashed var(--line)}
table.money td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
table.money tr.inc td{font-weight:800;color:var(--green);border-bottom:2px solid var(--line)}
.draw{display:grid;place-items:center;gap:14px;padding:30px 10px;text-align:center}
.deck{width:150px;height:200px;border-radius:14px;background:repeating-linear-gradient(45deg,var(--red),var(--red) 12px,#a02a23 12px,#a02a23 24px);
  border:6px solid var(--surface);box-shadow:0 0 0 2px var(--red),6px 6px 0 var(--line);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:22px}
.deck.gold{background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 12px,#c58b12 12px,#c58b12 24px);box-shadow:0 0 0 2px var(--gold),6px 6px 0 var(--line)}
.flip{animation:flip .6s ease}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
.msg{font-weight:800;border-radius:10px;padding:10px 14px}
.msg.ok{background:var(--green-soft);color:var(--green)}
.msg.bad{background:var(--red-soft);color:var(--red)}

/* leit */
.hunt{border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hunt.done{border-color:var(--green)}
.hunt .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hunt .head h3{margin:0}
.badge{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--gold-soft)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.prices{display:grid;grid-template-columns:28px 1fr 150px;gap:8px;align-items:center}
.prices .num{font-weight:800;color:var(--dim);text-align:center}
.prices .cheap input{border-color:var(--green);background:var(--green-soft)}
.star{color:var(--green);font-weight:800;font-size:14px}

/* karfa */
.sticky-sum{position:sticky;top:58px;z-index:4}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.sum div{display:flex;flex-direction:column}
.sum span{font-size:13px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.sum b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.sum .over b{color:var(--red)}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.bar.over i{background:var(--red)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:1.1fr 1.6fr 1.1fr .9fr .55fr auto;gap:8px;align-items:end;border:1.5px solid var(--line);border-radius:12px;padding:10px}
.line .tot{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;padding-bottom:9px}
.line .x{border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--dim);padding:6px 8px}
.line .handa{grid-column:1/-1}
@media (max-width:700px){.line{grid-template-columns:1fr 1fr}.line .tot{padding:0}}
.fixed{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--gold-soft);border-radius:12px;padding:10px 14px}
.fixed .c{font-weight:800;min-width:150px}
.fixed .v{flex:1 1 200px}
.fixed .s{color:var(--dim)}
.fixed .tot{font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks li::before{content:"○";font-weight:800;color:var(--dim);width:18px;flex:none}
.checks li.ok::before{content:"✓";color:var(--green)}
.checks li.ok{color:var(--dim)}

/* atvik */
.event{border-radius:16px;border:2px solid var(--gold);background:var(--gold-soft);padding:20px;display:flex;flex-direction:column;gap:8px}
.event h3{font-size:26px;margin:0}
.event .amt{font-family:var(--display);font-size:28px;font-weight:600}
.event .amt.minus{color:var(--red)}
.event .amt.plus{color:var(--green)}

/* kvittun */
.receipt{max-width:460px;margin:0 auto;background:#fffdf7;color:#1d2622;border:1.5px solid #ddd5c6;border-radius:6px;padding:22px 22px 26px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.5;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x;mask:none}
.receipt h3{font-family:var(--display);text-align:center;font-size:22px;margin:0}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1.5px dashed #b9b2a3;margin:10px 0}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .r span:first-child{overflow:hidden;text-overflow:ellipsis}
.receipt .r span:last-child{white-space:nowrap}
.receipt .cat{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12.5px;letter-spacing:.06em}
.receipt .store{color:#6b6559;font-size:12.5px}
.receipt .big{font-weight:700;font-size:16px}
.qa{display:flex;flex-direction:column;gap:14px}
.print-answers{display:none}

footer{padding-block:0 40px;color:var(--dim);font-size:14px}
footer .inner{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:14px}

@media print{
  header.hero,nav.rail,footer,.noprint,.btn{display:none!important}
  body{background:#fff;font-size:12pt}
  .card{border:0;padding:0}
  .receipt{border:1px solid #999}
  textarea{display:none}
  .print-answers{display:block;white-space:pre-wrap;border-left:3px solid #999;padding-left:10px;margin-top:4px}
}
</style>
</head>
<body>
<header class="hero pad"><div class="inner">

  <h1>Jólasjóður fjölskyldunnar</h1>

/* ============ STAÐA ============ */
const KEY="jolasjodur-v1";
const fresh=()=>({step:0,hopur:"",nofn:"",fam:null,sjodurSvar:"",sjodurOk:false,tilraunir:0,
  leit:Object.fromEntries(LEIT.map(l=>[l.id,{vara:"",handa:"",v:[{b:"",p:""},{b:"",p:""},{b:"",p:""}]}])),
  karfa:[],atvik:null,svor:SPURN.map(()=>"")});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ============ HJÁLP ============ */
const kr=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" kr.";
const num=s=>{const v=parseFloat(String(s??"").replace(/\s|\./g,"").replace(",","."));return isFinite(v)?v:NaN;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const fam=()=>S.fam==null?null:FAM[S.fam];
const utgjold=f=>f.utgjold.reduce((a,u)=>a+u[1],0);
const sjodur=()=>fam()?fam().laun-utgjold(fam()):0;
const atvikUpph=()=>S.atvik==null?0:ATVIK[S.atvik].a;
const heildarSjodur=()=>sjodur()+atvikUpph();
const vidtakendur=()=>{const f=fam();if(!f)return[];const l=[...f.folk,...f.aukagjafir];if(S.atvik!=null&&ATVIK[S.atvik].nyr)l.push(ATVIK[S.atvik].nyr);return l;};
function odyrast(id){const L=S.leit[id];let best=null;
  L.v.forEach((r,i)=>{const p=num(r.p);if(r.b.trim()&&p>0&&(best==null||p<num(L.v[best].p)))best=i;});
  return best;}
const leitBuin=id=>{const L=S.leit[id];return L.vara.trim()&&L.v.every(r=>r.b.trim()&&num(r.p)>0)&&(!LEIT.find(l=>l.id===id).gjof||L.handa);};
function allarLinur(){
  const out=[];
  for(const l of LEIT){if(!leitBuin(l.id))continue;const L=S.leit[l.id],i=odyrast(l.id);
    out.push({cat:l.cat,vara:L.vara,b:L.v[i].b,verd:num(L.v[i].p),magn:1,handa:L.handa,leit:true});}
  for(const k of S.karfa)out.push({...k,verd:num(k.verd),magn:num(k.magn)||0});
  return out;}
const linaSamtals=l=>(isFinite(l.verd)?l.verd:0)*(isFinite(l.magn)?l.magn:0);
const eytt=()=>allarLinur().reduce((a,l)=>a+linaSamtals(l),0);
function opinn(i){
  if(i<=1)return true;
  if(!S.sjodurOk)return false;
  if(i<=3)return true;
  if(i===4)return allarLinur().length>=6;
  return S.atvik!=null;}

/* ============ TEIKNING ============ */
function rail(){
  $("rail").innerHTML=STEPS.map((s,i)=>`<button data-step="${i}" ${S.step===i?'aria-current="step"':""} ${opinn(i)?"":"disabled"}><span class="n">${i}</span>${s}</button>`).join("");
  const w=$("whoLine");
  if(S.hopur||S.nofn){w.hidden=false;w.textContent=[S.hopur,S.nofn].filter(Boolean).join(" · ");}else w.hidden=true;
}
function go(i){if(!opinn(i))return;S.step=i;save();render();window.scrollTo({top:0,behavior:"smooth"});}
function nextBtn(i,txt){return `<div class="row noprint"><button class="btn gold right" data-go="${i}" ${opinn(i)?"":"disabled"}>${txt||"Áfram"} →</button></div>`;}

  if(S.step===3||S.step===4)updKarfa();}

/* ============ ATBURÐIR ============ */
$("rail").addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(b)go(+b.dataset.step);});
$("main").addEventListener("click",e=>{
  const t=e.target;
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  if(t.id==="drawFam"){S.fam=Math.floor(Math.random()*FAM.length);anim=true;save();render();return;}
  if(t.id==="checkSjodur"){const v=num($("sjodurSvar").value);S.sjodurSvar=$("sjodurSvar").value;S.tilraunir++;
    if(v===sjodur()){S.sjodurOk=true;save();render();}
    else{save();$("sjodurMsg").innerHTML=`<p class="msg bad">Ekki alveg. ${S.tilraunir>=2?"Ábending: Leggið fyrst öll útgjöldin saman og dragið svo summuna frá laununum.":"Reiknið aftur og munið að draga <b>öll</b> útgjöldin frá."}</p>`;}
    return;}
  if(t.id==="addLine"){S.karfa.push({cat:"Meðlæti",vara:"",b:"",verd:"",magn:"1",handa:""});save();render();
    const ins=document.querySelectorAll('#lines [data-k="vara"]');if(ins.length)ins[ins.length-1].focus();return;}
  const d=t.closest("[data-del]");if(d){S.karfa.splice(+d.dataset.del,1);save();render();return;}
  if(t.id==="drawEvent"){S.atvik=Math.floor(Math.random()*ATVIK.length);anim=true;save();render();return;}
  if(t.id==="printBtn"){window.print();return;}
});
$("main").addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="hopur"||t.id==="nofn"){S[t.id]=t.value;save();rail();return;}
  if(t.id==="sjodurSvar"){S.sjodurSvar=t.value;save();return;}
  if(t.dataset.leit){const L=S.leit[t.dataset.leit];if(t.dataset.i!=null)L.v[+t.dataset.i][t.dataset.k]=t.value;else L[t.dataset.k]=t.value;save();updLeit();rail();return;}
  if(t.dataset.r!=null){S.karfa[+t.dataset.r][t.dataset.k]=t.value;save();updKarfa();rail();return;}
  if(t.dataset.svar!=null){S.svor[+t.dataset.svar]=t.value;const p=t.nextElementSibling;if(p)p.textContent=t.value;save();return;}
});
$("main").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.r!=null&&t.dataset.k==="cat"){render();}   /* sýna/fela „handa hverjum“ */
});
$("main").addEventListener("keydown",e=>{if(e.target.id==="sjodurSvar"&&e.key==="Enter")$("checkSjodur")?.click();});
$("reset").addEventListener("click",e=>{const b=e.currentTarget;
  if(b.dataset.sure){S=fresh();save();delete b.dataset.sure;b.textContent="Kennari: byrja upp á nýtt";render();window.scrollTo(0,0);}
  else{b.dataset.sure="1";b.textContent="Ertu viss? Allt hjá hópnum eyðist. Smelltu aftur.";setTimeout(()=>{if(b.dataset.sure){delete b.dataset.sure;b.textContent="Kennari: byrja upp á nýtt";}},5000);}});
render();
</script>
</body>
</html>
