def('hvadveit','Hvað veit ég?','Merktu við 15 orð', () => {
  const st = S.get('know',{});
  return `<p class="lead">Áður en þú lest: hversu vel þekkir þú þessi orð? Vertu heiðarleg(ur). Þú merkir aftur í lokin og sérð hvað þú hefur lært.</p>
  ${nb(['Skrifaðu fyrirsögnina <em>Hvað veit ég?</em> og dagsetninguna.','Skrifaðu niður orðin sem þú merkir <em>Veit ekki</em>.'])}

    ${['Þekki vel','Hef séð það','Veit ekki'].map((l,i)=>`<button aria-pressed="${st[w]===i}" data-i="${i}">${l}</button>`).join('')}</div></div>`).join('')}</div>`;
}, );
T.hvadveit.after = () => app.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {

  const st = S.get('know',{}); st[seg.dataset.w] = +b.dataset.i; S.set('know',st);
  seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); markDone('hvadveit');

def('ordaspa','Orðaspá og skimun','Spáðu áður en þú lest', () => `
  <p class="lead">Þessi sex orð koma öll fyrir í textanum. Hvað heldur þú að hann fjalli um?</p>

  ${nb(['Skrifaðu tvær setningar með spánni þinni. Vinnið í pörum.','Opnaðu fréttina og lestu <b>aðeins</b> fyrirsögnina og millifyrirsagnirnar sjö. Breyttist spáin?','Textinn er í flokknum <em>Lífið</em> og höfundurinn skrifar vikulega pistla. Hvað segir það þér um tilgang textans? Skrifaðu eina setningu.'])}

  <p class="muted">Eftir lesturinn berið þið spána saman við textann. Hittuð þið á það?</p>`);

def('ordaspor','Orðaspor','Rannsakaðu ókunn orð', () => `

  <div class="notebook" style="background:var(--bg)"><strong>Dæmi</strong>
   <p><b>sporlaust</b>: (a) „án þess að nokkuð finnist“. (b) Orðin <em>hvarf</em> og <em>Hvað varð um</em> sýna að enginn veit hvar hún er.</p></div>

   <a class="btn ghost" style="text-decoration:none" href="https://snara.is" target="_blank" rel="noopener">Snara ↗</a>
   <a class="btn ghost" style="text-decoration:none" href="https://islenskordabok.arnastofnun.is" target="_blank" rel="noopener">Íslensk nútímamálsorðabók ↗</a>
  </div>`);

def('kjarnaord','Kjarnaorðin 15','Skrifaðu og útskýrðu', () => `
  <p class="lead">Þetta eru mikilvægustu orðin í textanum. Þú munt nota þau aftur í verkefnum, kynningu og ritun.</p>
  ${nb(['Skrifaðu hvert orð í stílabókina þína.','Útskýrðu hvað það þýðir <b>með þínum eigin orðum</b>.','Skrifaðu eina setningu þar sem þú notar orðið. Setningin má ekki vera úr fréttinni.'])}
  <p class="muted">Festist þú? Ýttu á <em>Hvar er orðið?</em> og lestu setninguna í fréttinni aftur.</p>
  <div class="words">${CORE.map(([w,h],i)=>`<div class="wordrow"><span class="w">${i+1}. ${w}</span>
   <button class="hint" data-h="${i}">Hvar er orðið?</button><span class="hinttext" id="h${i}" hidden>${h}</span></div>`).join('')}</div>`);
T.kjarnaord.after = () => app.querySelectorAll('.hint').forEach(b => b.onclick = () => { const t=document.getElementById('h'+b.dataset.h); t.hidden=!t.hidden; markDone('kjarnaord'); });

const FW = ['ráðgáta','vísbending','kenning','dulnefni'];
const FL = ['Skilgreining með mínum orðum','Dæmi úr textanum','Dæmi úr mínu lífi','Andheiti: orð sem merkir hið gagnstæða'];
let frayerIdx = 0;
def('frayer','Frayer-líkanið','Fjögur lykilorð', () => {
  const w = FW[frayerIdx], st = S.get('frayer',{});
  return `<p class="lead">Frayer-líkanið hjálpar þér að skilja orð til botns. Fylltu í alla fjóra reitina fyrir hvert orð.</p>
  ${nb(['Teiknaðu stóran kross á heila síðu og skrifaðu orðið í hring í miðjunni.','Fylltu í reitina fjóra. Þú mátt prófa hér fyrst.','Gerðu þetta fyrir öll fjögur orðin.'])}
  <div class="frayer-tabs tabs" role="tablist">${FW.map((x,i)=>`<button role="tab" aria-selected="${i===frayerIdx}" data-i="${i}">${x}</button>`).join('')}</div>
  <div class="frayer">${FL.map((l,i)=>`<div class="cell"><label for="fr${i}">${l}</label><textarea id="fr${i}" data-k="${w}|${i}">${esc(st[w+'|'+i]||'')}</textarea></div>`).join('')}
   <div class="center">${w}</div></div>
  <p class="muted">Það sem þú skrifar hér geymist aðeins í þessum vafra.</p>`;
});
T.frayer.after = () => {

};

def('samsett','Samsett orð','Brjóttu orðin upp', () => `
  <p class="lead">Íslenska raðar orðum saman eins og legókubbum. Ef þú brýtur löng orð í hluta skilurðu þau oft strax.</p>
  ${nb(['Skrifaðu hvert orð og skiptu því í hluta með strikum, t.d. <em>raf-mynt</em>.','Útskýrðu hvern hluta.','Hvaða hluti segir hvað hluturinn ER og hver lýsir honum?'])}
  <div class="words">${COMPOUNDS.map(([w,p],i)=>`<div class="wordrow"><span class="w">${w}</span>
   <button class="hint" data-h="${i}">Sýna skiptingu</button><span class="hinttext" id="c${i}" hidden>${p}</span></div>`).join('')}</div>
  <p class="muted">Prófaðu fyrst sjálf(ur) áður en þú skoðar skiptinguna.</p>`);
T.samsett.after = () => app.querySelectorAll('.hint').forEach(b => b.onclick = () => { const t=document.getElementById('c'+b.dataset.h); t.hidden=!t.hidden; markDone('samsett'); });

let mPairs = {}, mSel = null, mOrder = null;
def('ordtok','Orðtök','Paraðu saman', () => {
  if(!mOrder){ mOrder = IDIOMS.map((_,i)=>i).sort(()=>Math.random()-.5); }
  return `<p class="lead">Átta orðtök úr textanum. Smelltu á orðtak og svo á merkinguna sem passar.</p>
  <div class="match">
   <div class="col"><h3>Orðtak</h3>${IDIOMS.map((x,i)=>`<button class="chip ${mSel===i?'sel':''} ${mPairs[i]!==undefined?'paired':''}" data-l="${i}">
     ${mPairs[i]!==undefined?`<span class="tag">${String.fromCharCode(65+mOrder.indexOf(mPairs[i]))}</span>`:''}${x[0]}</button>`).join('')}</div>
   <div class="col"><h3>Merking</h3>${mOrder.map((j,k)=>`<button class="chip ${Object.values(mPairs).includes(j)?'paired':''}" data-r="${j}"><span class="tag">${String.fromCharCode(65+k)}</span>${IDIOMS[j][1]}</button>`).join('')}</div>
  </div>
  <div class="row-actions"><button class="btn" id="mcheck">Athuga</button><button class="btn ghost" id="mreset">Byrja aftur</button><span class="result" id="mres"></span></div>
  ${nb(['Skrifaðu orðtökin átta og merkingu þeirra.','Veldu fjögur orðtök og skrifaðu eina setningu um <b>þitt eigið líf</b> með hverju.'])}`;
});
T.ordtok.after = () => {
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { mSel = +b.dataset.l; render(); });
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    if(mSel===null) return; const j=+b.dataset.r;
    for(const k in mPairs) if(mPairs[k]===j) delete mPairs[k];
    mPairs[mSel]=j; mSel=null; render(); });
  document.getElementById('mreset').onclick = () => { mPairs={}; mSel=null; mOrder=null; render(); };
  document.getElementById('mcheck').onclick = () => {
    let ok=0; app.querySelectorAll('[data-l]').forEach(b => { const i=+b.dataset.l;
      if(mPairs[i]===undefined) return; const good = mPairs[i]===i; if(good) ok++; b.classList.add(good?'ok':'bad'); });
    document.getElementById('mres').textContent = `${ok} af ${IDIOMS.length} rétt`;
    if(ok===IDIOMS.length) markDone('ordtok');
  };
};

let posAns = {};
def('ordflokkar','Orðflokkagreining','Flokkaðu tíu orð', () => `
  <p class="lead">Í hvaða orðflokk fer hvert orð? Veldu einn hnapp fyrir hvert orð og ýttu svo á <em>Athuga</em>.</p>
  <div class="words sort">${POS.map(([w],i)=>`<div class="wordrow" id="pr${i}"><span class="w">${w}</span><div class="seg" data-i="${i}">
   ${Object.entries(POSL).map(([k,l])=>`<button data-k="${k}" aria-pressed="${posAns[i]===k}">${l}</button>`).join('')}</div></div>`).join('')}</div>
  <div class="row-actions"><button class="btn" id="pcheck">Athuga</button><span class="result" id="pres"></span></div>
  ${nb(['Teiknaðu töflu með fjórum dálkum: sagnorð, nafnorð, lýsingarorð og óbeygjanleg orð.','Skrifaðu orðin í réttan dálk.','Aukaspurning: Eitt orðanna getur verið í tveimur orðflokkum. Hvaða orð er það? Skrifaðu setningu með hvorri merkingu.'])}`);
T.ordflokkar.after = () => {
  app.querySelectorAll('.sort .seg').forEach(seg => seg.addEventListener('click', e => {
    const b=e.target.closest('button'); if(!b) return; posAns[seg.dataset.i]=b.dataset.k;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('pr'+seg.dataset.i).style.background=''; }));
  document.getElementById('pcheck').onclick = () => {
    let ok=0; POS.forEach(([w,a],i)=>{ const row=document.getElementById('pr'+i); if(!posAns[i]){row.style.background='';return;}
      const g=a.includes(posAns[i]); if(g) ok++; row.style.background = g?'var(--ok-soft)':'var(--bad-soft)'; });
    document.getElementById('pres').textContent = `${ok} af ${POS.length} rétt` + (ok===POS.length?' — vel gert! Mundu aukaspurninguna.':'');
    if(ok===POS.length) markDone('ordflokkar');
  };
};

let qTab = 0;

def('samantekt','Samantekt í 15 orðum','Hver ráðgáta í einni setningu', () => { const st=S.get('sum',{});
  return `<p class="lead">Dragðu hverja ráðgátu saman í <b>einni setningu, mest 15 orð</b>. Regla: Þú mátt ekki afrita meira en þrjú orð í röð úr textanum.</p>

T.samantekt.after = () => MYST.forEach((_,i)=>{ const inp=document.getElementById('s'+i), c=document.getElementById('sc'+i);
  const upd=()=>{ const n=inp.value.trim()?inp.value.trim().split(/\s+/).length:0; c.textContent=`${n} / 15 orð`; c.classList.toggle('over',n>15); };
  upd(); inp.oninput=()=>{ const st=S.get('sum',{}); st[i]=inp.value; S.set('sum',st); upd(); markDone('samantekt'); }; });

let tlPick = [], tlShuffle = null;
def('timalina','Tímalína og kort','Raðaðu atburðunum', () => {
  if(!tlShuffle) tlShuffle = EVENTS.map((_,i)=>i).sort(()=>Math.random()-.5);
  return `<p class="lead">Textinn spannar nærri 900 ár. Smelltu á atburðina í tímaröð, þann elsta fyrst.</p>
  <div class="events">${tlShuffle.map(i=>{ const p=tlPick.indexOf(i);
    return `<button class="chip event ${p>-1?'picked':''}" data-e="${i}" id="ev${i}"><span class="num">${p>-1?p+1:''}</span>${EVENTS[i][0]}<small>${EVENTS[i][2]}</small></button>`;}).join('')}</div>
  <div class="row-actions"><button class="btn" id="tcheck">Athuga röðina</button><button class="btn ghost" id="treset">Byrja aftur</button><span class="result" id="tres"></span></div>
  ${nb(['Teiknaðu langa línu frá árinu 1200 til 2030 og merktu aldirnar.','Settu alla atburðina á línuna með ártali.','Merktu staðina á heimskort, eða teiknaðu einfalt kort.','Svaraðu: Hvar er lengsta bilið milli tveggja atburða á tímalínunni og hve mörg ár eru það?','Svaraðu: Hvaða ráðgátur tengjast nýrri tækni og hvaða tækni er það?'])}`;});
T.timalina.after = () => {
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const i=+b.dataset.e, p=tlPick.indexOf(i);
    if(p>-1) tlPick.splice(p,1); else tlPick.push(i); render(); });
  document.getElementById('treset').onclick = () => { tlPick=[]; tlShuffle=null; render(); };
  document.getElementById('tcheck').onclick = () => {
    let ok=0; tlPick.forEach((e,k)=>{ const g=e===k; if(g) ok++; document.getElementById('ev'+e).classList.add(g?'ok':'bad');
      document.querySelector('#ev'+e+' small').textContent = EVENTS[e][2]+' · '+EVENTS[e][1]; });
    document.getElementById('tres').textContent = tlPick.length<EVENTS.length ? `Þú hefur raðað ${tlPick.length} af ${EVENTS.length}. ${ok} á réttum stað.` : `${ok} af ${EVENTS.length} á réttum stað`;
    if(ok===EVENTS.length) markDone('timalina');
  };
};

def('danspagan','Dansplágan: þrjár skýringar','Heimildir og sjónarhorn', () => `

  <div class="scroll"><table class="fill"><tr><th>Tími</th><th>Skýring</th><th>Hvað segir skýringin um hugsunarhátt fólks á þeim tíma?</th></tr>
   <tr><th>Miðaldir</th><td></td><td></td></tr><tr><th>Síðar</th><td></td><td></td></tr><tr><th>Nú</th><td></td><td></td></tr></table></div>
  <ol class="q"><li>Á miðöldum kenndi fólk guði, djöflinum eða dýrlingum um dansæðið. Hvers vegna heldur þú að fólk hafi leitað skýringa í trúnni? Hugsaðu um hvað fólk vissi þá um sjúkdóma, líkamann og hugann og hve stóran sess kirkjan hafði í lífi fólks.</li>
   <li>Síðar kom fram sú kenning að sveppur í hveiti hefði valdið ofskynjunum. Hvers vegna gat sú skýring ekki komið fram á miðöldum? Hvað þurfti fólk að vita fyrst?</li>

/* ---------- framvinda ---------- */
function markDone(id){ const d=S.get('done',{}); if(!d[id]){ d[id]=1; S.set('done',d); } }
const ORDER = GROUPS.flatMap(g=>g.ids);

/* ---------- síður ---------- */
function news(){
  const done=S.get('done',{});
  return `<header class="top"><button class="brand" data-go="heim">RÁÐGÁTUSTOFAN</button><button class="back" data-go="heim">← Forsíða</button></header>
  <article class="sheet">
   <span class="eyebrow">MÁL NR. 1 · PISTILL EFTIR SIF SIGMARSDÓTTUR</span>
   <h1>Óleyst íslensk ráðgáta: Veist þú svarið?</h1>
   <p class="lead">Höfundurinn fer yfir sjö af stærstu ráðgátum heims, allt frá miðöldum til dagsins í dag, og spyr hvort gervigreind sé að leysa allar gátur heimsins. Síðasta ráðgátan kemur á óvart.</p>
   <a class="cta" href="${ARTICLE}" target="_blank" rel="noopener">Lesa fréttina á Vísi ↗</a>
   <p class="muted">Fréttin opnast í nýjum flipa. Komdu svo aftur hingað til að vinna verkefnin.</p>
  </article>
  ${GROUPS.map(g=>`<section class="group"><div class="group-title"><h2>${g.t}</h2>${g.s?`<small>(${g.s})</small>`:''}</div>
   <div class="tasks">${g.ids.map(id=>`<button class="task" data-go="${id}"><b>${T[id].title}</b><span>${T[id].sub}</span>${done[id]?'<span class="done">Byrjað</span>':''}</button>`).join('')}</div></section>`).join('')}`;
}
function task(id){
  const t=T[id], i=ORDER.indexOf(id), prev=ORDER[i-1], next=ORDER[i+1], g=GROUPS.find(g=>g.ids.includes(id));
  return `<header class="top"><button class="brand" data-go="heim">RÁÐGÁTUSTOFAN</button><button class="back" data-go="radgatur">← Öll verkefni</button></header>
  <article class="sheet"><span class="eyebrow">${g.t.toUpperCase()}</span><h1>${t.title}</h1>${t.render()}</article>
  <nav class="pager">${prev?`<button class="back" data-go="${prev}">← ${T[prev].title}</button>`:'<span></span>'}${next?`<button class="back" data-go="${next}">${T[next].title} →</button>`:''}</nav>`;
}

let view = 'radgatur';
function render(){
  app.innerHTML = T[view] ? task(view) : news();
  if(T[view] && T[view].after) T[view].after();
}
function go(v){ if(v==='heim'){ location.href='../'; return; } view=v; render(); window.scrollTo({top:0}); try{ history.replaceState(null,'','#'+v); }catch(e){} }
app.addEventListener('click', e => { const b=e.target.closest('[data-go]'); if(b){ e.preventDefault(); go(b.dataset.go); } });
const h = (location.hash||'').slice(1); if(h==='radgatur' || T[h]) view=h;
render();
</script>
</body>
